<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suite Logistique — Lycée Gaston Darboux</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #e9e7e0;
    --panel: #ffffff;
    --ink: #211f1a;
    --ink-soft: #57544c;
    --line: #cdc9bf;
    --orange: #d9530f;
    --orange-dark: #a83e0a;
    --yellow: #f0ac00;
    --steel: #33505d;
    --steel-light: #6e8894;
    --danger: #b23a2f;
    --green: #2f7a3d;
    --radius: 3px;
    --mono: "IBM Plex Mono", "Courier New", monospace;
    --sans: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
    --display: "Archivo Black", Impact, "Arial Black", sans-serif;
  }
  * { box-sizing: border-box; }
  body{ margin:0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .wrap{ max-width: 1040px; margin: 0 auto; padding: 0 20px 60px; }

  header.topbar{
    padding: 20px 0;
    display:flex;
    justify-content: space-between;
    align-items:center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .brand{ display:flex; align-items:center; gap: 10px; }
  .brand-mark{
    width: 34px; height: 34px;
    background: var(--ink);
    display:flex; align-items:center; justify-content:center;
    color: var(--yellow);
    font-family: var(--display);
    font-size: 15px;
  }
  .brand-name{ font-family: var(--display); font-size: 16px; letter-spacing: -0.01em; line-height:1.15; }
  .brand-tagline{ font-size: 11px; color: var(--ink-soft); font-family: var(--mono); letter-spacing: 0.02em; }
  .institution-line{
    font-family: var(--mono); font-size: 11px; color: var(--ink-soft);
    letter-spacing: 0.04em; margin-bottom: 4px;
  }
  footer.site-footer{
    margin-top: 34px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--ink-soft); text-align:center;
  }

  .session-chip{
    display:flex; align-items:center; gap: 10px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .badge-role{
    font-family: var(--mono);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: var(--radius);
    background: var(--steel);
    color: #fff;
  }
  .badge-role.eleve{ background: var(--steel-light); }
  .logout-link{
    background:none; border:none; color: var(--orange); font-size: 13px; cursor:pointer; font-weight: 600; padding: 0;
  }

  .hazard{
    height: 8px; width: 100%;
    background: repeating-linear-gradient(-45deg, var(--orange), var(--orange) 12px, var(--ink) 12px, var(--ink) 24px);
    margin: 0 0 28px;
  }

  /* ---- Login / setup ---- */
  .center-stage{
    min-height: 60vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 0;
  }
  .badge-card{
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 6px solid var(--orange);
    border-radius: var(--radius);
    padding: 28px 26px 24px;
  }
  .badge-card h1{
    font-family: var(--display);
    font-size: 22px;
    margin: 0 0 4px;
  }
  .badge-card .sub{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 20px;
  }
  .badge-icon{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }

  label{ display:block; font-size: 13px; font-weight: 600; margin: 12px 0 5px; }
  label:first-of-type{ margin-top: 0; }
  input, select{
    width: 100%; padding: 9px 10px; font-family: var(--sans); font-size: 14px;
    border: 1px solid var(--line); border-radius: var(--radius); background: #fdfcfa; color: var(--ink);
  }
  input[data-mono="true"]{ font-family: var(--mono); text-transform: uppercase; }
  input:focus, select:focus, button:focus{ outline: 2px solid var(--orange); outline-offset: 1px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap: 6px;
    border: none; border-radius: var(--radius); padding: 10px 16px;
    font-family: var(--sans); font-weight: 700; font-size: 13px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .btn-primary{ background: var(--orange); color: #fff; width: 100%; margin-top: 18px; }
  .btn-primary:hover{ background: var(--orange-dark); }
  .btn-primary:disabled{ background: #c9c2b6; cursor: not-allowed; }
  .btn-ghost{
    background: transparent; border: 1px solid var(--line); color: var(--ink-soft);
    text-transform: none; font-weight: 600; padding: 8px 13px;
  }
  .btn-ghost:hover{ border-color: var(--steel); color: var(--steel); }
  .btn-danger{ background: transparent; border: 1px solid var(--danger); color: var(--danger); text-transform:none; font-weight:600; padding: 6px 11px; font-size:12px;}
  .btn-danger:hover{ background: var(--danger); color:#fff; }

  .error-box{
    background: #fbe9e6; border: 1px solid var(--danger); color: var(--danger);
    font-size: 13px; padding: 8px 10px; border-radius: var(--radius); margin-top: 12px;
  }
  .info-box{
    background: #eef3f4; border: 1px solid #cddadd; color: var(--steel);
    font-size: 12.5px; padding: 8px 10px; border-radius: var(--radius); margin-top: 14px; line-height:1.5;
  }

  /* ---- Menu ---- */
  .menu-intro h1{ font-family: var(--display); font-size: clamp(24px,4vw,36px); margin: 4px 0 6px; }
  .menu-intro p{ color: var(--ink-soft); font-size: 14px; max-width: 60ch; margin: 0 0 26px; }

  .module-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px,1fr));
    gap: 14px;
  }
  .module-tile{
    position: relative;
    text-align:left;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 8px solid var(--steel-light);
    padding: 16px;
    cursor: pointer;
    font-family: var(--sans);
  }
  .tile-badge{
    position: absolute;
    top: 12px;
    right: 12px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--orange);
    box-shadow: 0 0 0 2px var(--panel);
  }
  .module-tile:hover{ border-left-color: var(--orange); }
  .module-tile.disabled{ cursor: default; opacity: 0.55; }
  .module-tile.disabled:hover{ border-left-color: var(--steel-light); }
  .module-tile .code{ font-family: var(--mono); font-size: 11px; color: var(--ink-soft); display:block; }
  .module-tile .title{ font-weight: 700; font-size: 15.5px; margin: 4px 0 6px; }
  .module-tile .desc{ font-size: 12.5px; color: var(--ink-soft); line-height: 1.4; }
  .module-tile.admin{ border-left-color: var(--orange); background: #fff9f4; }

  /* ---- Module (magasin) reused layout ---- */
  nav.aisles{ display:flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .aisle-btn{
    flex: 1 1 180px; min-width: 150px; text-align:left; background: var(--panel);
    border: 1px solid var(--line); border-left: 8px solid var(--steel-light); padding: 10px 14px;
    cursor: pointer; font-family: var(--sans);
  }
  .aisle-btn .code{ display:block; font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; color: var(--ink-soft); }
  .aisle-btn .label{ display:block; font-weight: 700; font-size: 15px; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.02em; }
  .aisle-btn .count{ display:block; font-family: var(--mono); font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .aisle-btn.active{ border-left-color: var(--orange); background: #fff9f4; }

  .board{ display:grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 720px){ .board{ grid-template-columns: 1fr; } }

  .panel{ background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .panel h2{
    font-family: var(--sans); font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-soft); margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
  }

  .hint{ font-size: 12px; color: var(--ink-soft); margin-top: 3px; }

  table{ width:100%; border-collapse: collapse; font-size: 13.5px; }
  thead th{
    text-align:left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-soft); padding: 6px 8px; border-bottom: 2px solid var(--ink);
  }
  tbody td{ padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:hover{ background: #faf9f6; }
  td.code-cell, .ref-tag{
    font-family: var(--mono); font-size: 12.5px; background: #f0eee7; padding: 2px 6px;
    border-radius: var(--radius); display:inline-block;
  }
  .del-btn{
    background: none; border: 1px solid var(--line); color: var(--danger); font-size: 11px;
    padding: 4px 8px; border-radius: var(--radius); cursor: pointer; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .del-btn:hover{ background: var(--danger); color: #fff; border-color: var(--danger); }
  .edit-btn{
    background: none; border: 1px solid var(--line); color: var(--steel); font-size: 11px;
    padding: 4px 8px; border-radius: var(--radius); cursor: pointer; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .edit-btn:hover{ background: var(--steel); color: #fff; border-color: var(--steel); }
  .empty-state{
    padding: 34px 12px; text-align:center; color: var(--ink-soft); font-size: 14px;
    border: 1px dashed var(--line); border-radius: var(--radius);
  }
  .empty-state strong{ display:block; color: var(--ink); margin-bottom: 4px; font-size: 15px;}
  .loading-row{ padding: 40px 12px; text-align:center; color: var(--ink-soft); font-family: var(--mono); font-size: 13px; }

  .table-head-row{
    display:flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
    padding-bottom: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 10px;
  }
  .table-title{ font-family: var(--sans); font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }

  .back-link{
    background:none; border:none; color: var(--steel); font-size: 13px; cursor:pointer;
    font-weight: 600; padding: 0 0 16px; display:inline-flex; align-items:center; gap:5px;
  }
  .back-link:hover{ color: var(--orange); }

  .toast{
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(0);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: var(--radius); font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(-4px); }

  /* Admin */
  .admin-form-row{ display:flex; gap: 10px; flex-wrap: wrap; align-items:flex-end; margin-bottom: 20px; }
  .admin-form-row > div{ flex: 1 1 140px; }
  .role-pill{
    font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: var(--radius);
    background: var(--steel); color:#fff;
  }
  .role-pill.eleve{ background: var(--steel-light); }

  /* ---- Messagerie ---- */
  .messagerie-board{ grid-template-columns: 260px 1fr; }
  .thread-list{ display:flex; flex-direction:column; gap:6px; }
  .thread-item{
    display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px;
    text-align:left; background:#fdfcfa; border:1px solid var(--line); border-radius: var(--radius);
    padding: 8px 10px; cursor:pointer; font-family: var(--sans);
  }
  .thread-item.active{ border-color: var(--orange); background:#fff9f4; }
  .thread-name{ font-weight:700; font-size: 13px; }
  .thread-preview{ flex-basis:100%; font-size:11.5px; color: var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .unread-dot{ width:8px; height:8px; border-radius:50%; background: var(--orange); display:inline-block; }

  .thread-scroll{ display:none; } /* obsolète, conservé pour compat, non utilisé */

  .mail-panel{ padding: 0; overflow: hidden; }
  .mail-toolbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 18px; border-bottom: 1px solid var(--line); background: #fafaf8;
  }
  .mail-toolbar h2{ font-size: 15px; margin:0; border:none; padding:0; text-transform:none; letter-spacing:0; color: var(--ink); font-weight:700; }
  #mailBody{ padding: 0; }

  .mail-list{ display:flex; flex-direction:column; }
  .mail-row{
    display:grid;
    grid-template-columns: 16px 130px 1fr auto;
    align-items:center; gap: 12px;
    width:100%; text-align:left; background: var(--panel); border:none; border-bottom: 1px solid var(--line);
    padding: 12px 18px; cursor:pointer; font-family: var(--sans); font-size: 13.5px; color: var(--ink);
  }
  .mail-row:hover{ background: #faf8f4; }
  .mail-row.unread{ background: #fffaf5; }
  .mail-row.unread .mail-sender, .mail-row.unread .mail-subject{ font-weight: 700; }
  .mail-dot{ color: var(--orange); font-size: 10px; text-align:center; }
  .mail-sender{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13px; }
  .mail-subject-line{ overflow:hidden; white-space:nowrap; text-overflow:ellipsis; min-width:0; }
  .mail-subject{ color: var(--ink); }
  .mail-snippet{ color: var(--ink-soft); }
  .mail-subject-line .mail-snippet::before{ content:" — "; }
  .mail-date{ font-family: var(--mono); font-size: 11px; color: var(--ink-soft); white-space:nowrap; }
  @media (max-width: 640px){
    .mail-row{ grid-template-columns: 14px 1fr auto; }
    .mail-row .mail-subject-line{ grid-column: 2 / 3; }
    .mail-row .mail-sender{ display:none; }
  }

  .mail-empty{ padding: 46px 20px; text-align:center; color: var(--ink-soft); font-size: 14px; }
  .mail-empty strong{ display:block; color: var(--ink); margin-bottom: 4px; font-size: 15px; }

  .mail-detail{ padding: 18px; }
  .mail-detail-header{ border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 14px; }
  .mail-detail-subject{ font-family: var(--display); font-size: 19px; margin-bottom: 6px; }
  .mail-detail-meta{ font-size: 12.5px; color: var(--ink-soft); }
  .mail-detail-badge{
    font-family: var(--mono); font-size: 10px; text-transform:uppercase; letter-spacing:0.04em;
    padding: 2px 7px; border-radius: var(--radius); background: var(--steel); color:#fff; margin-left: 6px;
  }
  .mail-detail-badge.client{ background: #a8801a; }
  .mail-detail-badge.bot{ background: var(--steel-light); }
  .mail-detail-body{ font-size: 14.5px; line-height:1.6; white-space: pre-wrap; margin-bottom: 22px; }
  .mail-detail-actions{ display:flex; gap:10px; padding-top: 14px; border-top: 1px solid var(--line); }
  .mail-back{ padding: 14px 18px 0; }

  .order-line{
    display:flex; gap:8px; align-items:center; margin-bottom:8px;
  }
  .order-line select{ flex:1 1 auto; }
  .order-line input{ width:70px; flex:0 0 70px; }
  .order-line-remove{
    background:none; border:1px solid var(--line); color: var(--ink-soft); cursor:pointer;
    padding: 8px 10px; border-radius: var(--radius); flex:0 0 auto;
  }
  .order-line-remove:hover{ color: var(--danger); border-color: var(--danger); }

  .recipient-box{
    border: 1px solid var(--line); border-radius: var(--radius); background:#fdfcfa;
    max-height: 220px; overflow-y:auto; padding: 4px 0;
  }
  .recipient-item{
    display:flex; align-items:center; gap:8px; padding: 7px 12px; font-size: 13.5px; cursor:pointer;
  }
  .recipient-item:hover{ background: #f5f3ee; }
  .recipient-item input[type="checkbox"]{ width:15px; height:15px; flex:0 0 auto; }
  .recipient-all{ font-family: var(--sans); }
  .recipient-divider{ height:1px; background: var(--line); margin: 2px 0; }

  .image-preview{ margin-top: 8px; }
  .image-preview img{ max-width: 120px; max-height: 120px; border-radius: var(--radius); border: 1px solid var(--line); display:block; margin-bottom: 6px; }
  .image-remove{ background:none; border:1px solid var(--line); color: var(--danger); font-size: 11px; padding: 4px 8px; border-radius: var(--radius); cursor:pointer; }
  .image-remove:hover{ background: var(--danger); color:#fff; }
  .table-thumb{ width: 42px; height: 42px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--line); display:block; }

  .bon-header{ display:flex; justify-content:space-between; align-items:flex-start; padding-bottom:14px; border-bottom:1px solid var(--line); margin-bottom:14px; }
  .bon-client{ padding: 12px 14px; background:#faf8f4; border:1px solid var(--line); border-radius: var(--radius); font-size:14px; line-height:1.5; }

  .doc-tabs{ display:flex; gap:8px; margin-top:16px; }
  .doc-tab{
    background: var(--panel); border:1px solid var(--line); border-bottom:none;
    padding: 8px 16px; font-family: var(--sans); font-size:13px; font-weight:600; color: var(--ink-soft);
    cursor:pointer; border-radius: var(--radius) var(--radius) 0 0;
  }
  .doc-tab.active{ color: var(--ink); background:#fff9f4; border-color: var(--orange); border-bottom: 2px solid #fff9f4; margin-bottom:-1px; }
  .doc-tab:disabled{ cursor:not-allowed; opacity:0.5; }

  .livraison-parties{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  @media (max-width: 640px){ .livraison-parties{ grid-template-columns: 1fr; } }

  .signature-row{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:40px; }
  .signature-box{
    border-top:1px solid var(--ink); padding-top:8px; font-size:12px; color: var(--ink-soft);
    height: 60px;
  }

  .progress-track{ height: 10px; background:#e5e2da; border-radius: 6px; overflow:hidden; margin: 16px 0 22px; }
  .progress-fill{ height:100%; background: var(--orange); transition: width .3s ease; }

  .excel-steps-list{ display:flex; flex-direction:column; gap:10px; }
  .excel-step{
    display:flex; align-items:center; gap:16px; background: var(--panel); border:1px solid var(--line);
    border-left: 8px solid var(--steel-light); border-radius: var(--radius); padding: 14px 16px;
  }
  .excel-step.done{ border-left-color: var(--green); background: #f4faf5; }
  .excel-step-num{
    width: 34px; height:34px; flex:0 0 auto; border-radius:50%; background: var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family: var(--display); font-size:15px;
  }
  .excel-step.done .excel-step-num{ background: var(--green); }
  .excel-step-body{ flex:1 1 auto; min-width:0; }
  .excel-step-title{ font-weight:700; font-size:14.5px; margin-bottom:3px; }
  .excel-step-objectif{ font-size:12.5px; color: var(--ink-soft); }
  .excel-note-badge{
    display:inline-block; margin-top:6px; font-family: var(--mono); font-size:11.5px; font-weight:700;
    color: var(--steel); background:#eef3f4; border:1px solid #cddadd; padding:2px 8px; border-radius: var(--radius);
  }
  .excel-step-actions{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex:0 0 auto; }
  .excel-done-toggle{ display:flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer; white-space:nowrap; }
  .excel-done-toggle input{ width:15px; height:15px; }
  @media (max-width: 640px){
    .excel-step{ flex-wrap:wrap; }
    .excel-step-actions{ align-items:flex-start; width:100%; flex-direction:row; justify-content:space-between; }
  }

  .livraison-help-grid{ display:grid; grid-template-columns: 1fr 280px; gap:20px; align-items:start; }
  @media (max-width: 760px){ .livraison-help-grid{ grid-template-columns: 1fr; } }
  .help-box{
    background: #eef3f4; border: 1px solid #cddadd; border-radius: var(--radius);
    padding: 14px; font-size: 12.5px; line-height: 1.55; color: var(--ink);
  }
  .help-box-title{ font-weight: 700; margin-bottom: 8px; font-size: 13px; color: var(--steel); }
  .help-box ul{ margin: 0; padding-left: 18px; }
  .help-box li{ margin-bottom: 8px; }
  .help-box li:last-child{ margin-bottom: 0; }

  @media print {
    body *{ visibility: hidden; }
    #printArea, #printArea *{ visibility: visible; }
    #printArea{ position:absolute; top:0; left:0; width:100%; border:none; padding:0; }
    .no-print{ display:none !important; }
    .no-print-input{ color: transparent !important; background: #fff !important; }
  }

  .compose-box{ padding: 18px; }
  .compose-box textarea{
    width:100%; padding: 9px 10px; font-family: var(--sans); font-size: 14px;
    border: 1px solid var(--line); border-radius: var(--radius); background: #fdfcfa; color: var(--ink); resize: vertical;
  }
  @media (max-width: 720px){ .messagerie-board{ grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="loading-row">Chargement…</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){

  /* ============ STORAGE (Firebase Realtime Database) ============ */
  const DB_ROOT = "suiteLogistiqueDarboux";

  function dbRef(path){
    return firebase.database().ref(`${DB_ROOT}/${path}`);
  }

  function dbRefGroupe(path){
    return firebase.database().ref(`${DB_ROOT}/groupes/${state.activeGroupe}/${path}`);
  }

  function dbRefGroupeExplicit(groupe, path){
    return firebase.database().ref(`${DB_ROOT}/groupes/${groupe}/${path}`);
  }

  async function fbGetAll(ref){
    const snap = await ref.get();
    const val = snap.val();
    return val ? Object.values(val) : [];
  }

  async function fbSetAll(ref, items){
    const obj = {};
    items.forEach(item => { obj[item.id] = item; });
    await ref.set(obj);
  }

  // Écrit UN SEUL élément (ajout ou modification), sans toucher aux autres entrées de la table.
  // C'est ce qui évite que deux élèves qui saisissent en même temps s'écrasent mutuellement.
  async function fbPutItem(ref, item){
    try{ await ref.child(item.id).set(item); return true; }
    catch(e){ showToast("Échec de l'enregistrement."); return false; }
  }

  // Supprime UN SEUL élément par son id, sans toucher aux autres.
  async function fbRemoveItem(ref, id){
    try{ await ref.child(id).remove(); return true; }
    catch(e){ showToast("Échec de la suppression."); return false; }
  }

  // Ajoute/fusionne PLUSIEURS éléments en une fois (import CSV), sans écraser les entrées existantes.
  async function fbMergeItems(ref, items){
    if(items.length === 0) return true;
    try{
      const updates = {};
      items.forEach(it => { updates[it.id] = it; });
      await ref.update(updates);
      return true;
    }catch(e){ showToast("Échec de l'enregistrement."); return false; }
  }

  // Met à jour uniquement certains champs de certains éléments (ex: marquer des messages comme lus)
  // sans réécrire les objets entiers ni toucher aux autres entrées.
  async function fbUpdatePaths(ref, pathUpdates){
    if(Object.keys(pathUpdates).length === 0) return true;
    try{ await ref.update(pathUpdates); return true; }
    catch(e){ return false; }
  }

  function downloadBase64File(base64, filename, mime){
    try{
      const byteChars = atob(base64);
      const byteNumbers = new Array(byteChars.length);
      for(let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }catch(e){
      showToast("Échec du téléchargement du fichier.");
    }
  }

  /* ============ CORRECTION AUTOMATIQUE DES FICHIERS EXCEL ============ */
  function normText(v){
    return (v === undefined || v === null) ? "" : String(v).trim().toLowerCase();
  }
  function numEq(a, b, tol){
    tol = tol || 0.05;
    const na = parseFloat(a), nb = parseFloat(b);
    if(isNaN(na) || isNaN(nb)) return false;
    return Math.abs(na - nb) <= tol;
  }
  function cellVal(ws, ref){
    const cell = ws[ref];
    return cell ? cell.v : undefined;
  }

  function gradeEtape1(ws){
    const details = [];
    STEP1_DESIGNATIONS.forEach((expected, i) => {
      const ref = `B${i + 2}`;
      const got = cellVal(ws, ref);
      const ok = normText(got) === normText(expected);
      details.push({ cell: ref, ok, expected, got });
    });
    return details;
  }

  function gradeEtape2(ws){
    const total = STEP2_QTES.reduce((a,b) => a+b, 0);
    const moyenne = total / STEP2_QTES.length;
    const details = [
      { cell: `C${STEP2_TOTAL_ROW}`, ok: numEq(cellVal(ws,`C${STEP2_TOTAL_ROW}`), total), expected: total, got: cellVal(ws,`C${STEP2_TOTAL_ROW}`), label: "Total" },
      { cell: `C${STEP2_MOYENNE_ROW}`, ok: numEq(cellVal(ws,`C${STEP2_MOYENNE_ROW}`), moyenne, 0.02), expected: Math.round(moyenne*100)/100, got: cellVal(ws,`C${STEP2_MOYENNE_ROW}`), label: "Moyenne" }
    ];
    return details;
  }

  function gradeEtape3(ws){
    const details = [];
    STEP3_DATA.forEach(([qte, seuil], i) => {
      const ref = `E${i + 2}`;
      const expected = qte < seuil ? "À commander" : "OK";
      const got = cellVal(ws, ref);
      details.push({ cell: ref, ok: normText(got) === normText(expected), expected, got });
    });
    return details;
  }

  function gradeEtape6(ws){
    const details = [];
    let totalQte = 0, totalValeur = 0;
    STEP6_DATA.forEach(([qte, seuil, prix], i) => {
      const row = i + 2;
      const valeurAttendue = qte * prix;
      const statutAttendu = qte < seuil ? "À commander" : "OK";
      totalQte += qte;
      totalValeur += valeurAttendue;
      details.push({ cell: `F${row}`, ok: numEq(cellVal(ws, `F${row}`), valeurAttendue, 0.05), expected: Math.round(valeurAttendue*100)/100, got: cellVal(ws, `F${row}`), label: `Valeur stock ligne ${row}` });
      details.push({ cell: `G${row}`, ok: normText(cellVal(ws, `G${row}`)) === normText(statutAttendu), expected: statutAttendu, got: cellVal(ws, `G${row}`), label: `Statut ligne ${row}` });
    });
    details.push({ cell: `C${STEP6_TOTAL_ROW}`, ok: numEq(cellVal(ws,`C${STEP6_TOTAL_ROW}`), totalQte), expected: totalQte, got: cellVal(ws,`C${STEP6_TOTAL_ROW}`), label: "Total quantité" });
    details.push({ cell: `F${STEP6_TOTAL_ROW}`, ok: numEq(cellVal(ws,`F${STEP6_TOTAL_ROW}`), totalValeur, 0.1), expected: Math.round(totalValeur*100)/100, got: cellVal(ws,`F${STEP6_TOTAL_ROW}`), label: "Total valeur stock" });
    return details;
  }

  function gradeWorkbook(stepId, workbook){
    const ws = workbook.Sheets["Exercice"];
    if(!ws) return null;
    let details;
    if(stepId === "etape1") details = gradeEtape1(ws);
    else if(stepId === "etape2") details = gradeEtape2(ws);
    else if(stepId === "etape3") details = gradeEtape3(ws);
    else if(stepId === "etape6") details = gradeEtape6(ws);
    else return null;
    const correct = details.filter(d => d.ok).length;
    const total = details.length;
    const note = Math.round((correct / total) * 20 * 2) / 2; // arrondi au demi-point
    return { note, correct, total, details };
  }

  function gradeC31(ws){
    const details = [];
    POLE3_C31_TYPES.forEach((type, i) => {
      const ref = `D${i + 2}`;
      const expected = POLE3_C31_ZONEMAP[type];
      details.push({ cell: ref, ok: normText(cellVal(ws, ref)) === normText(expected), expected, got: cellVal(ws, ref) });
    });
    return details;
  }

  function excelSerialOrDateToJs(v){
    if(v instanceof Date) return v;
    if(typeof v === "number"){
      // Date sérielle Excel (jours depuis 1899-12-30)
      return new Date(Date.UTC(1899, 11, 30) + v * 86400000);
    }
    const parsed = new Date(v);
    return isNaN(parsed) ? null : parsed;
  }

  function gradeC32(ws){
    const details = [];
    POLE3_C32_DATA.forEach((row, i) => {
      const r = i + 4;
      const dlc = new Date(row.dlc + "T00:00:00");
      const diffDays = Math.round((dlc - POLE3_REF_DATE) / 86400000);
      const expectedStatut = diffDays < 0 ? "Périmé" : (diffDays <= 7 ? "À surveiller" : "OK");
      const expectedTaux = row.ret / row.qte;
      details.push({ cell: `G${r}`, ok: normText(cellVal(ws, `G${r}`)) === normText(expectedStatut), expected: expectedStatut, got: cellVal(ws, `G${r}`), label: `Statut DLC ligne ${r}` });
      details.push({ cell: `H${r}`, ok: numEq(cellVal(ws, `H${r}`), expectedTaux, 0.01), expected: Math.round(expectedTaux*1000)/1000, got: cellVal(ws, `H${r}`), label: `Taux de retour ligne ${r}` });
    });
    return details;
  }

  function gradeC33(ws){
    const details = [];
    let totalProd = 0, totalVal = 0;
    POLE3_C33_DATA.forEach((row, i) => {
      const r = i + 4;
      const tauxAttendu = row.val / row.prod;
      const statutAttendu = tauxAttendu < POLE3_C33_SEUIL ? "Action RSE nécessaire" : "Objectif atteint";
      totalProd += row.prod; totalVal += row.val;
      details.push({ cell: `D${r}`, ok: numEq(cellVal(ws, `D${r}`), tauxAttendu, 0.01), expected: Math.round(tauxAttendu*1000)/1000, got: cellVal(ws, `D${r}`), label: `Taux valorisation ligne ${r}` });
      details.push({ cell: `E${r}`, ok: normText(cellVal(ws, `E${r}`)) === normText(statutAttendu), expected: statutAttendu, got: cellVal(ws, `E${r}`), label: `Statut RSE ligne ${r}` });
    });
    const totalRow = 3 + POLE3_C33_DATA.length + 2;
    const tauxGlobalAttendu = totalVal / totalProd;
    details.push({ cell: `B${totalRow}`, ok: numEq(cellVal(ws, `B${totalRow}`), totalProd), expected: totalProd, got: cellVal(ws, `B${totalRow}`), label: "Total produit" });
    details.push({ cell: `C${totalRow}`, ok: numEq(cellVal(ws, `C${totalRow}`), totalVal), expected: totalVal, got: cellVal(ws, `C${totalRow}`), label: "Total valorisé" });
    details.push({ cell: `D${totalRow}`, ok: numEq(cellVal(ws, `D${totalRow}`), tauxGlobalAttendu, 0.01), expected: Math.round(tauxGlobalAttendu*1000)/1000, got: cellVal(ws, `D${totalRow}`), label: "Taux global" });
    return details;
  }

  function gradeC34(ws){
    const details = [];
    POLE3_C34_DATA.forEach((row, i) => {
      const r = i + 2;
      const tempsTotalAttendu = row.vol * row.tps;
      const operateursAttendus = Math.ceil(tempsTotalAttendu / row.duree);
      const statutAttendu = operateursAttendus > row.eff ? "Renfort nécessaire" : "Effectif suffisant";
      details.push({ cell: `E${r}`, ok: numEq(cellVal(ws, `E${r}`), tempsTotalAttendu, 0.5), expected: tempsTotalAttendu, got: cellVal(ws, `E${r}`), label: `Temps total ligne ${r}` });
      details.push({ cell: `F${r}`, ok: numEq(cellVal(ws, `F${r}`), operateursAttendus, 0.01), expected: operateursAttendus, got: cellVal(ws, `F${r}`), label: `Opérateurs ligne ${r}` });
      details.push({ cell: `H${r}`, ok: normText(cellVal(ws, `H${r}`)) === normText(statutAttendu), expected: statutAttendu, got: cellVal(ws, `H${r}`), label: `Statut ligne ${r}` });
    });
    return details;
  }

  function gradePole3Workbook(exerciceId, workbook){
    const ws = workbook.Sheets["Exercice"];
    if(!ws) return null;
    let details;
    if(exerciceId === "c31") details = gradeC31(ws);
    else if(exerciceId === "c32") details = gradeC32(ws);
    else if(exerciceId === "c33") details = gradeC33(ws);
    else if(exerciceId === "c34") details = gradeC34(ws);
    else return null;
    const correct = details.filter(d => d.ok).length;
    const total = details.length;
    const note = Math.round((correct / total) * 20 * 2) / 2;
    return { note, correct, total, details };
  }

  /* ---- Correction étude de cas Brasseries du Gâtinais ---- */
  function normAccentless(s){
    return (s === undefined || s === null) ? "" : s.toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
  }

  function gradeBrasserie(workbook){
    const details = [];

    Object.entries(BRASSERIE_PALETTE_EXPECTED).forEach(([sheetName, exp]) => {
      const ws = workbook.Sheets[sheetName];
      if(!ws) return;
      const poids = cellVal(ws, "B15");
      const hauteur = cellVal(ws, "B24");
      details.push({ cell: `${sheetName}!B15`, ok: numEq(poids, exp.poids, 0.5), expected: exp.poids, got: poids, label: `${sheetName} — poids palette chargée` });
      details.push({ cell: `${sheetName}!B24`, ok: numEq(hauteur, exp.hauteur, 1), expected: exp.hauteur, got: hauteur, label: `${sheetName} — hauteur palette chargée` });
    });

    const wsStock = workbook.Sheets["Mise en stock"];
    if(wsStock){
      BRASSERIE_STOCK_EXPECTED.forEach(({ rows, expected }) => {
        ["C","G","K"].forEach(col => {
          rows.forEach((row, idx) => {
            const ref = `${col}${row}`;
            const exp = expected[col][idx];
            const got = cellVal(wsStock, ref);
            details.push({ cell: `Mise en stock!${ref}`, ok: normText(got) === normText(exp), expected: exp, got, label: `Mise en stock ${ref}` });
          });
        });
      });
    }

    const wsQ = workbook.Sheets["Questions"];
    if(wsQ){
      const q1 = normAccentless(cellVal(wsQ, "B3"));
      details.push({ cell: "Questions!B3", ok: q1.includes("longueur") && q1.includes("largeur") && q1.includes("hauteur"), expected: "Longueur x largeur x hauteur", got: cellVal(wsQ,"B3"), label: "Question 1 (Lxlxh)" });

      const q2 = normAccentless(cellVal(wsQ, "B9"));
      details.push({ cell: "Questions!B9", ok: q2.includes("polytereph"), expected: "Polytéréphtalate d'éthylène", got: cellVal(wsQ,"B9"), label: "Question 2 (PET)" });

      const q5 = normAccentless(cellVal(wsQ, "B31"));
      details.push({ cell: "Questions!B31", ok: q5.includes("lettre") && q5.includes("chiffre"), expected: "Combinaison de lettres et de chiffres", got: cellVal(wsQ,"B31"), label: "Question 5 (code alphanumérique)" });
    }

    const correct = details.filter(d => d.ok).length;
    const total = details.length;
    const note = Math.round((correct / total) * 20 * 2) / 2;
    return { note, correct, total, details };
  }

  /* ============ BOT MESSAGERIE (100% local, sans appel réseau) ============ */
  const CANNED_REPLIES = {
    technique: "Message reçu. Quelques pistes avant que votre enseignant ne regarde : rafraîchissez la page, vérifiez votre matricule/mot de passe, et si le souci persiste, décrivez précisément ce qui ne fonctionne pas (ce qui s'affiche, ce que vous avez cliqué). Votre enseignant a été notifié.",
    absence: "Message bien reçu. Votre enseignant en a été informé et pourra revenir vers vous si besoin.",
    rdv: "Votre demande de rendez-vous a été transmise à votre enseignant, qui vous recontactera pour convenir d'un horaire."
  };

  const FAQ_KEYWORDS = [
    { match: ["stock", "inventaire", "quantit"], reply: "Pour une question de gestion de stock : la table Stock du module « Base du magasin » relie un produit à un emplacement avec une quantité. Vérifiez que le produit et l'emplacement concernés existent déjà dans leurs tables respectives. Votre enseignant complétera si besoin." },
    { match: ["picking", "préparation de commande", "prepa commande"], reply: "Pour la préparation de commandes, pensez à l'ordre logique : vérifier le bon de commande, localiser l'emplacement via son code, prélever la quantité exacte, puis mettre à jour le stock. Votre enseignant reviendra vers vous pour les détails de l'exercice." },
    { match: ["emplacement", "allée", "zone", "entrepot", "entrepôt"], reply: "Pour les emplacements, le code suit en général une logique zone-allée-niveau (ex : A-03-02). Consultez la table Emplacements du module magasin pour voir les codes déjà créés. Votre enseignant vous précisera si besoin." },
    { match: ["transport", "tourn", "livraison", "camion"], reply: "Les questions de transport et de tournées seront couvertes plus en détail dans le module dédié (bientôt disponible). Votre enseignant peut déjà vous orienter en attendant." },
    { match: ["fournisseur", "délai", "delai"], reply: "Pour les fournisseurs, la table Fournisseurs du module magasin recense le nom, le contact et le délai de livraison. Si l'info n'y figure pas encore, c'est à ajouter avant de continuer l'exercice." },
    { match: ["caces", "chariot", "engin"], reply: "Les questions sur la conduite d'engins et le CACES relèvent d'un encadrement pratique : votre enseignant vous répondra directement sur ce point." }
  ];

  async function getBotReply(objetKey, body){
    const objet = OBJETS.find(o => o.key === objetKey);
    if(!objet || objet.mode === "canned"){
      return CANNED_REPLIES[objetKey] || "Message transmis à votre enseignant.";
    }
    const lower = (body || "").toLowerCase();
    const hit = FAQ_KEYWORDS.find(f => f.match.some(k => lower.includes(k)));
    if(hit) return hit.reply;
    return "Merci pour votre message. C'est une question précise qui mérite une réponse de votre enseignant, qui vous répondra directement ici. En attendant, vous pouvez consulter le module concerné ou vos notes de cours.";
  }

  async function handleLogin(matricule, password){
    const user = findUser(matricule);
    if(!user || user.password !== password){
      state.loginError = "Matricule ou mot de passe incorrect.";
      render();
      return;
    }
    state.currentUser = user;
    state.activeGroupe = user.role === "eleve" ? (user.groupe || null) : null;
    state.loginError = "";
    await saveSession(user.matricule);
    state.view = "menu";
    render();
  }

    state.currentUser = null;
    state.activeGroupe = null;
    await clearSession();
    state.view = "login";

  async function enterModule(moduleId){
    state.activeModule = moduleId;
    if(moduleId === "magasin"){
      await loadAllModuleTables();
      state.activeTable = "produits";
      state.editingRowId = null;
    }
    if(moduleId === "messagerie"){
      await loadMessages();
      if(state.currentUser.role === "enseignant"){
        await loadModuleTable("produits");
        await loadModuleTable("clients");
      }
      state.activeThreadMatricule = state.currentUser.role === "eleve" ? state.currentUser.matricule : null;
      state.mailView = "list";
      state.openMessageId = null;
    }
    if(moduleId === "picking"){
      await loadAllModuleTables();
      await loadCommandes();
      state.commandeView = "list";
      state.activeCommandeId = null;
    }
    if(moduleId === "reception"){
      await loadAllModuleTables();
      await loadCommandes();
      await loadReceptions();
      state.receptionView = "list";
      state.activeReceptionId = null;
    }
    if(moduleId === "excel"){

        await loadAllExcelProgress();
        await loadAllExcelNotes();

        await loadExcelNotes();

        await loadAllPole3Notes();
      } else {
        await loadPole3Notes();
      }
    }
    if(moduleId === "brasserie"){
      if(state.currentUser.role === "enseignant"){
        await loadAllBrasserieNotes();
      } else {

      }

  // Supprime automatiquement les lignes de Stock dont le produit ou l'emplacement référencé
  // n'existe plus (après suppression d'un produit/emplacement, ou vidage de table).
  async function reconcileStockOrphans(){
    await loadModuleTable("produits");
    await loadModuleTable("emplacements");
    await loadModuleTable("stock");
    const validRefs = new Set(state.moduleData.produits.map(p => p.reference));
    const validEmpl = new Set(state.moduleData.emplacements.map(e => e.code_emplacement));
    const orphanRows = state.moduleData.stock.filter(row => !validRefs.has(row.produit_ref) || !validEmpl.has(row.emplacement_code));
    for(const row of orphanRows){
      await fbRemoveItem(dbRefGroupe("stock"), row.id);
    }
    state.moduleData.stock = state.moduleData.stock.filter(row => validRefs.has(row.produit_ref) && validEmpl.has(row.emplacement_code));
    return orphanRows.length;
  }

  // Redimensionne et compresse une image côté navigateur avant stockage (garde la base légère).
  function readAndCompressImage(file, maxDim = 320, quality = 0.72){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if(width > height && width > maxDim){ height = Math.round(height * maxDim / width); width = maxDim; }
          else if(height > maxDim){ width = Math.round(width * maxDim / height); height = maxDim; }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function displayValue(row, field){
    if(field.type === "linked-select"){
      const linked = state.moduleData[field.linkedTable].find(r => field.linkedValue(r) === row[field.key]);
      return linked ? field.linkedDisplay(linked) : `<em>${row[field.key]} (introuvable)</em>`;
    }
    if(field.type === "image"){
      return row[field.key] ? `<img src="${row[field.key]}" class="table-thumb" />` : "—";
    }
    return row[field.key] || "—";
  }

  function computeInitials(fullName){
    const words = fullName.trim().split(/\s+/).filter(Boolean);
    if(words.length === 0) return "?";
    let i = 0;
    while(i < words.length - 1 && words[i] === words[i].toUpperCase() && /[A-ZÀ-Ÿ]/.test(words[i])){
      i++;
    }
    if(i === 0) i = 1;
    const surname = words.slice(0, i).join(" ");
    const firstname = words.slice(i).join(" ") || words[words.length - 1];
    const firstNameWord = firstname.trim().split(/\s+/)[0] || "?";
    const properFirstName = firstNameWord.charAt(0).toUpperCase() + firstNameWord.slice(1).toLowerCase();
    const surnameInitial = (surname.trim()[0] || "?").toUpperCase();
    return `${properFirstName} ${surnameInitial}.`;
  }

  function parseCSV(text){
    const rows = [];
    let i = 0, field = "", row = [], inQuotes = false;
    const len = text.length;
    while(i < len){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if(c === '"'){ inQuotes = true; i++; continue; }
      if(c === ";"){ row.push(field); field = ""; i++; continue; }
      if(c === "\r"){ i++; continue; }
      if(c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
      field += c; i++;
    }
    if(field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
    return rows;
  }

  async function handleCsvImport(file, t){
    const rawText = await file.text();
    const text = rawText.replace(/^\uFEFF/, "");
    const rows = parseCSV(text).filter(r => r.some(c => c.trim() !== ""));
    if(rows.length < 2){
      showToast("Fichier CSV vide ou illisible.");
      return;
    }
    const csvFields = t.fields.filter(f => f.type !== "image");
    const headerRow = rows[0].map(h => h.trim().toLowerCase());
    const fieldIndexes = csvFields.map(f => headerRow.indexOf(f.label.toLowerCase()));
    if(fieldIndexes.some(idx => idx === -1)){
      showToast(`Colonnes attendues pour ${t.label} : ${csvFields.map(f => f.label).join(", ")}.`);
      return;
    }
    // Recharge la table la plus récente avant de vérifier les doublons
    await loadModuleTable(state.activeTable);
    const keyField = csvFields.find(f => f.code);
    const newEntries = [];
    let skipped = 0;
    for(let r = 1; r < rows.length; r++){
      const cells = rows[r];
      const entry = { id: uid(), createdBy: state.currentUser.matricule, createdByNom: state.currentUser.nom };
      let invalid = false;
      csvFields.forEach((f, idx) => {
        let val = (cells[fieldIndexes[idx]] || "").trim();
        if(f.code) val = val.toUpperCase();
        if(f.required && !val) invalid = true;
        entry[f.key] = val;
      });
      if(invalid){ skipped++; continue; }
      const existsAlready = keyField && (
        state.moduleData[state.activeTable].some(row => row[keyField.key] === entry[keyField.key]) ||
        newEntries.some(row => row[keyField.key] === entry[keyField.key])
      );
      if(existsAlready){ skipped++; continue; }
      newEntries.push(entry);
    }
    await fbMergeItems(dbRefGroupe(state.activeTable), newEntries);
    showToast(`${newEntries.length} ligne(s) importée(s)${skipped ? `, ${skipped} ignorée(s)` : ""}.`);
    await loadModuleTable(state.activeTable);
    render();
  }

  async function handleRosterCsvImport(file, groupe){
    const rawText = await file.text();
    const text = rawText.replace(/^\uFEFF/, "");
    const rows = parseCSV(text).filter(r => r.some(c => c.trim() !== ""));
    if(rows.length < 2){
      showToast("Fichier CSV vide ou illisible.");
      return;
    }
    const header = rows[0].map(h => h.trim().toLowerCase());
    const idxEleve = header.findIndex(h => h.includes("élève") || h.includes("eleve"));
    const idxMatricule = header.findIndex(h => h.includes("matricule"));
    const idxMotDePasse = header.findIndex(h => h.includes("mot de passe") || h.includes("password"));
    if(idxMatricule === -1){
      showToast("Colonne « Matricule » introuvable dans le fichier.");
      return;
    }
    // Recharge la liste des comptes la plus récente avant de vérifier les doublons
    await loadUsers();
    const newUsers = [];
    let skipped = 0;
    for(let r = 1; r < rows.length; r++){
      const cells = rows[r];
      const matricule = (cells[idxMatricule] || "").trim().toUpperCase();
      if(!matricule || findUser(matricule) || newUsers.some(u => u.matricule === matricule)){
        if(matricule) skipped++;
        continue;
      }
      const fullName = idxEleve !== -1 ? (cells[idxEleve] || "").trim() : "";
      const nom = fullName ? computeInitials(fullName) : matricule;
      const password = (idxMotDePasse !== -1 && (cells[idxMotDePasse] || "").trim()) ? cells[idxMotDePasse].trim() : matricule;
      newUsers.push({ id: uid(), matricule, nom, password, role: "eleve", groupe });
    }
    await fbMergeItems(dbRef("users"), newUsers);
    showToast(`${newUsers.length} élève(s) importé(s) dans ${groupe}${skipped ? `, ${skipped} déjà existant(s) ignoré(s)` : ""}.`);
    await loadUsers();
    render();
  }

      const stocks = stockRowsForProduit(ref);
      if(stocks.length === 0) return `<option value="">Aucun stock disponible</option>`;
      return stocks.map(s => {
        const empl = state.moduleData.emplacements.find(e => e.code_emplacement === s.emplacement_code);
        return `<option value="${s.emplacement_code}">${s.emplacement_code}${empl ? ` (${empl.zone})` : ""} — dispo : ${s.quantite}</option>`;

    function addLine(){
      lineCount++;

      row.className = "order-line";

      const firstRef = state.moduleData.produits[0].reference;
      row.innerHTML = `

        ${printAreaHTML}

      ${docView === "preparation" && !isValidated ? `
        <div class="panel no-print" style="margin-top:16px;">
          <h2>Validation du prélèvement</h2>

          <button class="btn btn-primary" id="validateBtn" style="width:auto;">Valider la préparation et mettre à jour le stock</button>
        </div>
      ` : ""}
      ${docView === "preparation" && isValidated ? `
        <div class="info-box no-print" style="margin-top:16px;">Préparation validée le ${new Date(c.validatedAt).toLocaleString("fr-FR")}. Le stock a été mis à jour en conséquence. Vous pouvez maintenant imprimer le bon de livraison.</div>
      ` : ""}
    `;

    document.getElementById("backBtn").addEventListener("click", () => { state.commandeView = "list"; state.activeCommandeId = null; render(); });
    document.getElementById("printBtn").addEventListener("click", () => window.print());
    document.getElementById("tabPreparation").addEventListener("click", () => { state.commandeDocView = "preparation"; render(); });
    const tabLivraison = document.getElementById("tabLivraison");
    if(tabLivraison && !tabLivraison.disabled){
      tabLivraison.addEventListener("click", () => { state.commandeDocView = "livraison"; render(); });
    }
    const deleteCommandeBtn = document.getElementById("deleteCommandeBtn");
    if(deleteCommandeBtn) deleteCommandeBtn.addEventListener("click", async () => {
      if(!confirm(`Supprimer le bon de préparation ${c.numero} ? Cette action est irréversible.`)) return;
      const ok = await fbRemoveItem(dbRefGroupe("commandes"), c.id);
      if(!ok) return;
      state.commandes = state.commandes.filter(x => x.id !== c.id);
      state.commandeView = "list"; state.activeCommandeId = null;
      showToast("Bon de préparation supprimé.");
      render();
    });

    if(docView === "livraison"){
      wireLivraisonSettings(c, content);
      return;

    if(isValidated) return;

    document.getElementById("validateBtn").addEventListener("click", async () => {
      const errorBox = document.getElementById("validateError");
      errorBox.innerHTML = "";
      const inputs = [...content.querySelectorAll(".valid-qte-input")];
      const qtes = inputs.map(inp => parseInt(inp.value, 10));
      if(qtes.some(q => isNaN(q) || q < 0)){
        errorBox.innerHTML = `<div class="error-box">Chaque quantité prélevée doit être un nombre positif ou nul.</div>`;
        return;
      }

      // Recharge le stock le plus récent avant de déduire (concurrence avec d'autres élèves)
      await loadModuleTable("stock");

      for(let i = 0; i < c.lignes.length; i++){
        const ligne = c.lignes[i];
        const qtePrelevee = qtes[i];
        ligne.qtePrelevee = qtePrelevee;
        if(ligne.emplacement_code && qtePrelevee > 0){
          const stockRow = state.moduleData.stock.find(s => s.produit_ref === ligne.produit_ref && s.emplacement_code === ligne.emplacement_code);
          if(stockRow){
            stockRow.quantite = Math.max(0, (parseInt(stockRow.quantite, 10) || 0) - qtePrelevee);
            await fbPutItem(dbRefGroupe("stock"), stockRow);
          }
        }
      }

      c.statut = "validee";
      c.validatedAt = Date.now();
      await fbPutItem(dbRefGroupe("commandes"), c);

      showToast("Préparation validée, stock mis à jour.");
      render();
    });
  }

  /* ============ RENDER : MODULE RECEPTION (contrôle réception fournisseur) ============ */
  function nextReceptionNumber(){
    const n = state.receptions.length + 1;
    return `BR-${String(n).padStart(4,"0")}`;
  }

  function canDeleteReception(r){
    return state.currentUser.role === "enseignant" || r.createdBy === state.currentUser.matricule;
  }

  function generateRandomReceptionLines(){
    const produits = state.moduleData.produits;
    const emplacements = state.moduleData.emplacements;
    if(produits.length === 0 || emplacements.length === 0) return [];
    const count = Math.min(produits.length, 2 + Math.floor(Math.random() * 4)); // 2 à 5 lignes
    const shuffled = [...produits].sort(() => Math.random() - 0.5).slice(0, count);
    return shuffled.map(p => {
      const empl = emplacements[Math.floor(Math.random() * emplacements.length)];
      const qte = 5 + Math.floor(Math.random() * 46); // 5 à 50
      return { produit_ref: p.reference, designation: p.designation, emplacement_code: empl.code_emplacement, qteAnnoncee: qte };
    });
  }

  function renderModuleReception(content){
    if(state.receptionView === "new") renderReceptionNew(content);
    else if(state.receptionView === "detail" && state.activeReceptionId) renderReceptionDetail(content);
    else renderReceptionList(content);

  function renderReceptionNew(content){
    const canBuild = state.moduleData.produits.length > 0 && state.moduleData.emplacements.length > 0;
    content.innerHTML = `
      <button class="back-link" id="backBtn">&larr; Retour à la liste</button>
      <div class="panel">
        <h2>Nouveau bon de réception</h2>
        ${!canBuild ? `<div class="empty-state">Ajoutez au moins un produit et un emplacement dans le module Base du magasin avant de créer une réception.</div>` : `
          <label>Origine</label>
          <div style="display:flex; gap:20px; margin-bottom:12px; font-size:13.5px;">
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="radio" name="rcOrigine" value="aleatoire" id="origineAleatoire" checked /> Génération aléatoire</label>
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="radio" name="rcOrigine" value="preparation" id="originePreparation" /> Basée sur une préparation existante</label>
          </div>

            <option value="">— Choisir un fournisseur —</option>
            ${state.moduleData.fournisseurs.map(f => `<option value="${f.id}">${f.nom}</option>`).join("")}

        `}
      </div>
    `;
    document.getElementById("backBtn").addEventListener("click", () => { state.receptionView = "list"; render(); });

    const linesHost = document.getElementById("rcLines");
    const fournisseurSelect = document.getElementById("rcFournisseur");

    function addRcLine(prefill){
      const row = document.createElement("div");
      row.className = "order-line";
      row.innerHTML = `
        <select class="rc-line-produit">${state.moduleData.produits.map(p => `<option value="${p.reference}" ${prefill && prefill.produit_ref === p.reference ? "selected" : ""}>${p.reference} — ${p.designation}</option>`).join("")}</select>
        <select class="rc-line-emplacement">${state.moduleData.emplacements.map(e => `<option value="${e.code_emplacement}" ${prefill && prefill.emplacement_code === e.code_emplacement ? "selected" : ""}>${e.code_emplacement}</option>`).join("")}</select>
        <input class="rc-line-qte" type="number" min="1" value="${prefill ? prefill.qteAnnoncee : 1}" placeholder="Qté" />
        <button type="button" class="order-line-remove" title="Retirer cette ligne">✕</button>
      `;
      row.querySelector(".order-line-remove").addEventListener("click", () => {
        if(linesHost.children.length > 1){ row.remove(); }
        else { showToast("Il faut au moins une ligne de produit."); }
      });
      linesHost.appendChild(row);
    }

    function resetLines(prefillArray){
      linesHost.innerHTML = "";
      if(prefillArray && prefillArray.length > 0){
        prefillArray.forEach(p => addRcLine(p));
      } else {
        addRcLine(null);
      }
    }

    resetLines();
    document.getElementById("rcAddLineBtn").addEventListener("click", () => addRcLine(null));

    const blocAleatoire = document.getElementById("blocAleatoire");
    const blocPreparation = document.getElementById("blocPreparation");
    document.querySelectorAll('input[name="rcOrigine"]').forEach(radio => {

        blocPreparation.style.display = isPrepa ? "block" : "none";
        resetLines();
      });
    });

    document.getElementById("rcGenerateBtn").addEventListener("click", () => {
      const lines = generateRandomReceptionLines();
      resetLines(lines);
      if(state.moduleData.fournisseurs.length > 0){
        fournisseurSelect.value = state.moduleData.fournisseurs[Math.floor(Math.random() * state.moduleData.fournisseurs.length)].id;
      }
      showToast("Lignes générées aléatoirement.");
    });

    document.getElementById("rcCommandeSelect").addEventListener("change", (e) => {
      const cmd = state.commandes.find(c => c.id === e.target.value);
      if(!cmd){ resetLines(); return; }
      const prefill = cmd.lignes.map(l => ({
        produit_ref: l.produit_ref,
        designation: l.designation,
        emplacement_code: l.emplacement_code || (state.moduleData.emplacements[0] ? state.moduleData.emplacements[0].code_emplacement : ""),
        qteAnnoncee: l.qteCommandee
      }));
      resetLines(prefill);
    });

    document.getElementById("rcCreateBtn").addEventListener("click", async () => {
      const errorBox = document.getElementById("rcError");
      errorBox.innerHTML = "";
      const fournisseur = state.moduleData.fournisseurs.find(f => f.id === fournisseurSelect.value);
      if(!fournisseur){
        errorBox.innerHTML = `<div class="error-box">Choisissez un fournisseur.</div>`;
        return;

      const isPrepa = document.getElementById("originePreparation").checked;
      const commandeRef = isPrepa ? state.commandes.find(c => c.id === document.getElementById("rcCommandeSelect").value) : null;
      if(isPrepa && !commandeRef){

        const produit = state.moduleData.produits.find(p => p.reference === ref);
        return {
          produit_ref: ref,
          designation: produit ? produit.designation : ref,
          emplacement_code,
          qteAnnoncee: qte,
          qteRecue: null, qteAcceptee: null, qteRefusee: null, observation: ""
        };
      });
      if(lignes.some(l => !l.qteAnnoncee || l.qteAnnoncee < 1)){
        errorBox.innerHTML = `<div class="error-box">Chaque ligne doit avoir une quantité annoncée d'au moins 1.</div>`;
        return;

      const reception = {
        id: uid(),
        numero: nextReceptionNumber(),
        fournisseurId: fournisseur.id,
        fournisseurNom: fournisseur.nom,
        origine: isPrepa ? "preparation" : "aleatoire",

        statut: "a_receptionner",
        createdBy: state.currentUser.matricule,
        createdByNom: state.currentUser.nom,
        createdAt: Date.now()
      };
      state.receptions.push(reception);
      await fbPutItem(dbRefGroupe("receptions"), reception);
      showToast(`Bon de réception ${reception.numero} créé.`);
      state.activeReceptionId = reception.id;
      state.receptionView = "detail";
      render();
    });
  }

                <td>${isValidated ? (l.qteRecue ?? "—") : `<input type="number" min="0" class="rc-qte-recue no-print-input" data-idx="${idx}" placeholder="${l.qteAnnoncee}" style="width:64px;" />`}</td>
                <td>${isValidated ? (l.qteAcceptee ?? "—") : `<input type="number" min="0" class="rc-qte-acceptee no-print-input" data-idx="${idx}" placeholder="${l.qteAnnoncee}" style="width:64px;" />`}</td>
                <td>${isValidated ? (l.qteRefusee ?? 0) : `<input type="number" min="0" class="rc-qte-refusee no-print-input" data-idx="${idx}" placeholder="0" style="width:64px;" />`}</td>
                <td>${isValidated ? (l.observation || "—") : `<input type="text" class="rc-observation no-print-input" data-idx="${idx}" placeholder="ex : carton abîmé" style="width:130px;" />`}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>

      ${!isValidated ? `
        <div class="panel no-print" style="margin-top:16px;">
          <h2>Validation de la réception</h2>
          <p class="hint" style="margin-bottom:12px;">Saisissez les quantités réellement reçues, acceptées et refusées, ainsi que vos observations. Valider ajoutera les quantités acceptées au stock.</p>
          <div id="validateRcError"></div>
          <button class="btn btn-primary" id="validateRcBtn" style="width:auto;">Valider la réception et mettre à jour le stock</button>
        </div>
      ` : `
        <div class="info-box no-print" style="margin-top:16px;">Réception validée le ${new Date(r.validatedAt).toLocaleString("fr-FR")} par ${r.receptionedByNom}. Le stock a été mis à jour en conséquence.</div>
      `}
    `;

    document.getElementById("backBtn").addEventListener("click", () => { state.receptionView = "list"; state.activeReceptionId = null; render(); });
    document.getElementById("printBtn").addEventListener("click", () => window.print());
    const deleteReceptionBtn = document.getElementById("deleteReceptionBtn");
    if(deleteReceptionBtn) deleteReceptionBtn.addEventListener("click", async () => {
      if(!confirm(`Supprimer le bon de réception ${r.numero} ? Cette action est irréversible.`)) return;
      const ok = await fbRemoveItem(dbRefGroupe("receptions"), r.id);
      if(!ok) return;
      state.receptions = state.receptions.filter(x => x.id !== r.id);
      state.receptionView = "list"; state.activeReceptionId = null;
      showToast("Bon de réception supprimé.");
      render();
    });

    if(isValidated) return;

    document.getElementById("validateRcBtn").addEventListener("click", async () => {
      const errorBox = document.getElementById("validateRcError");
      errorBox.innerHTML = "";
      const recues = [...content.querySelectorAll(".rc-qte-recue")].map(inp => parseInt(inp.value, 10));
      const acceptees = [...content.querySelectorAll(".rc-qte-acceptee")].map(inp => parseInt(inp.value, 10));
      const refusees = [...content.querySelectorAll(".rc-qte-refusee")].map(inp => parseInt(inp.value, 10));
      const observations = [...content.querySelectorAll(".rc-observation")].map(inp => inp.value.trim());

      if([...recues, ...acceptees, ...refusees].some(q => isNaN(q) || q < 0)){
        errorBox.innerHTML = `<div class="error-box">Toutes les quantités doivent être des nombres positifs ou nuls.</div>`;
        return;
      }

      // Recharge le stock le plus récent avant d'ajouter (concurrence avec d'autres élèves)
      await loadModuleTable("stock");

      for(let i = 0; i < r.lignes.length; i++){
        const ligne = r.lignes[i];
        ligne.qteRecue = recues[i];
        ligne.qteAcceptee = acceptees[i];
        ligne.qteRefusee = refusees[i];
        ligne.observation = observations[i];

        if(acceptees[i] > 0){
          let stockRow = state.moduleData.stock.find(s => s.produit_ref === ligne.produit_ref && s.emplacement_code === ligne.emplacement_code);
          if(stockRow){
            stockRow.quantite = (parseInt(stockRow.quantite, 10) || 0) + acceptees[i];
          } else {
            stockRow = {
              id: uid(), produit_ref: ligne.produit_ref, emplacement_code: ligne.emplacement_code,
              quantite: acceptees[i], createdBy: state.currentUser.matricule, createdByNom: state.currentUser.nom
            };
            state.moduleData.stock.push(stockRow);
          }
          await fbPutItem(dbRefGroupe("stock"), stockRow);
        }
      }

      r.statut = "receptionnee";
      r.receptionedBy = state.currentUser.matricule;
      r.receptionedByNom = state.currentUser.nom;
      r.validatedAt = Date.now();
      await fbPutItem(dbRefGroupe("receptions"), r);

      showToast("Réception validée, stock mis à jour.");
      render();
    });
  }
