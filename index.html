<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suite Logistique — Lycée Gaston Darboux</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

<style>
  :root{
    --bg: #e9e7e0;
    --panel: #ffffff;
    --ink: #211f1a;
    --ink-soft: #57544c;
    --line: #cdc9bf;
    --orange: #d9530f;
    --orange-dark: #a83e0a;
    --yellow: #f0ac00;
    --steel: #33505d;
    --steel-light: #6e8894;
    --danger: #b23a2f;
    --radius: 3px;
    --mono: "IBM Plex Mono", "Courier New", monospace;
    --sans: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
    --display: "Archivo Black", Impact, "Arial Black", sans-serif;
  }
  * { box-sizing: border-box; }
  body{ margin:0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .wrap{ max-width: 1040px; margin: 0 auto; padding: 0 20px 60px; }

  header.topbar{
    padding: 20px 0;
    display:flex;
    justify-content: space-between;
    align-items:center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .brand{ display:flex; align-items:center; gap: 10px; }
  .brand-mark{
    width: 34px; height: 34px;
    background: var(--ink);
    display:flex; align-items:center; justify-content:center;
    color: var(--yellow);
    font-family: var(--display);
    font-size: 15px;
  }
  .brand-name{ font-family: var(--display); font-size: 16px; letter-spacing: -0.01em; line-height:1.15; }
  .brand-tagline{ font-size: 11px; color: var(--ink-soft); font-family: var(--mono); letter-spacing: 0.02em; }
  .institution-line{
    font-family: var(--mono); font-size: 11px; color: var(--ink-soft);
    letter-spacing: 0.04em; margin-bottom: 4px;
  }
  footer.site-footer{
    margin-top: 34px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--ink-soft); text-align:center;
  }

  .session-chip{
    display:flex; align-items:center; gap: 10px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .badge-role{
    font-family: var(--mono);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: var(--radius);
    background: var(--steel);
    color: #fff;
  }
  .badge-role.eleve{ background: var(--steel-light); }
  .logout-link{
    background:none; border:none; color: var(--orange); font-size: 13px; cursor:pointer; font-weight: 600; padding: 0;
  }

  .hazard{
    height: 8px; width: 100%;
    background: repeating-linear-gradient(-45deg, var(--orange), var(--orange) 12px, var(--ink) 12px, var(--ink) 24px);
    margin: 0 0 28px;
  }

  /* ---- Login / setup ---- */
  .center-stage{
    min-height: 60vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 0;
  }
  .badge-card{
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 6px solid var(--orange);
    border-radius: var(--radius);
    padding: 28px 26px 24px;
  }
  .badge-card h1{
    font-family: var(--display);
    font-size: 22px;
    margin: 0 0 4px;
  }
  .badge-card .sub{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 20px;
  }
  .badge-icon{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }

  label{ display:block; font-size: 13px; font-weight: 600; margin: 12px 0 5px; }
  label:first-of-type{ margin-top: 0; }
  input, select{
    width: 100%; padding: 9px 10px; font-family: var(--sans); font-size: 14px;
    border: 1px solid var(--line); border-radius: var(--radius); background: #fdfcfa; color: var(--ink);
  }
  input[data-mono="true"]{ font-family: var(--mono); text-transform: uppercase; }
  input:focus, select:focus, button:focus{ outline: 2px solid var(--orange); outline-offset: 1px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap: 6px;
    border: none; border-radius: var(--radius); padding: 10px 16px;
    font-family: var(--sans); font-weight: 700; font-size: 13px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .btn-primary{ background: var(--orange); color: #fff; width: 100%; margin-top: 18px; }
  .btn-primary:hover{ background: var(--orange-dark); }
  .btn-primary:disabled{ background: #c9c2b6; cursor: not-allowed; }
  .btn-ghost{
    background: transparent; border: 1px solid var(--line); color: var(--ink-soft);
    text-transform: none; font-weight: 600; padding: 8px 13px;
  }
  .btn-ghost:hover{ border-color: var(--steel); color: var(--steel); }
  .btn-danger{ background: transparent; border: 1px solid var(--danger); color: var(--danger); text-transform:none; font-weight:600; padding: 6px 11px; font-size:12px;}
  .btn-danger:hover{ background: var(--danger); color:#fff; }

  .error-box{
    background: #fbe9e6; border: 1px solid var(--danger); color: var(--danger);
    font-size: 13px; padding: 8px 10px; border-radius: var(--radius); margin-top: 12px;
  }
  .info-box{
    background: #eef3f4; border: 1px solid #cddadd; color: var(--steel);
    font-size: 12.5px; padding: 8px 10px; border-radius: var(--radius); margin-top: 14px; line-height:1.5;
  }

  /* ---- Menu ---- */
  .menu-intro h1{ font-family: var(--display); font-size: clamp(24px,4vw,36px); margin: 4px 0 6px; }
  .menu-intro p{ color: var(--ink-soft); font-size: 14px; max-width: 60ch; margin: 0 0 26px; }

  .module-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px,1fr));
    gap: 14px;
  }
  .module-tile{
    position: relative;
    text-align:left;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 8px solid var(--steel-light);
    padding: 16px;
    cursor: pointer;
    font-family: var(--sans);
  }
  .tile-badge{
    position: absolute;
    top: 12px;
    right: 12px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--orange);
    box-shadow: 0 0 0 2px var(--panel);
  }
  .module-tile:hover{ border-left-color: var(--orange); }
  .module-tile.disabled{ cursor: default; opacity: 0.55; }
  .module-tile.disabled:hover{ border-left-color: var(--steel-light); }
  .module-tile .code{ font-family: var(--mono); font-size: 11px; color: var(--ink-soft); display:block; }
  .module-tile .title{ font-weight: 700; font-size: 15.5px; margin: 4px 0 6px; }
  .module-tile .desc{ font-size: 12.5px; color: var(--ink-soft); line-height: 1.4; }
  .module-tile.admin{ border-left-color: var(--orange); background: #fff9f4; }

  /* ---- Module (magasin) reused layout ---- */
  nav.aisles{ display:flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .aisle-btn{
    flex: 1 1 180px; min-width: 150px; text-align:left; background: var(--panel);
    border: 1px solid var(--line); border-left: 8px solid var(--steel-light); padding: 10px 14px;
    cursor: pointer; font-family: var(--sans);
  }
  .aisle-btn .code{ display:block; font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; color: var(--ink-soft); }
  .aisle-btn .label{ display:block; font-weight: 700; font-size: 15px; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.02em; }
  .aisle-btn .count{ display:block; font-family: var(--mono); font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .aisle-btn.active{ border-left-color: var(--orange); background: #fff9f4; }

  .board{ display:grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 720px){ .board{ grid-template-columns: 1fr; } }

  .panel{ background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .panel h2{
    font-family: var(--sans); font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-soft); margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
  }

  .hint{ font-size: 12px; color: var(--ink-soft); margin-top: 3px; }

  table{ width:100%; border-collapse: collapse; font-size: 13.5px; }
  thead th{
    text-align:left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-soft); padding: 6px 8px; border-bottom: 2px solid var(--ink);
  }
  tbody td{ padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:hover{ background: #faf9f6; }
  td.code-cell, .ref-tag{
    font-family: var(--mono); font-size: 12.5px; background: #f0eee7; padding: 2px 6px;
    border-radius: var(--radius); display:inline-block;
  }
  .del-btn{
    background: none; border: 1px solid var(--line); color: var(--danger); font-size: 11px;
    padding: 4px 8px; border-radius: var(--radius); cursor: pointer; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .del-btn:hover{ background: var(--danger); color: #fff; border-color: var(--danger); }
  .edit-btn{
    background: none; border: 1px solid var(--line); color: var(--steel); font-size: 11px;
    padding: 4px 8px; border-radius: var(--radius); cursor: pointer; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .edit-btn:hover{ background: var(--steel); color: #fff; border-color: var(--steel); }
  .empty-state{
    padding: 34px 12px; text-align:center; color: var(--ink-soft); font-size: 14px;
    border: 1px dashed var(--line); border-radius: var(--radius);
  }
  .empty-state strong{ display:block; color: var(--ink); margin-bottom: 4px; font-size: 15px;}
  .loading-row{ padding: 40px 12px; text-align:center; color: var(--ink-soft); font-family: var(--mono); font-size: 13px; }

  .table-head-row{
    display:flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
    padding-bottom: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 10px;
  }
  .table-title{ font-family: var(--sans); font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }

  .back-link{
    background:none; border:none; color: var(--steel); font-size: 13px; cursor:pointer;
    font-weight: 600; padding: 0 0 16px; display:inline-flex; align-items:center; gap:5px;
  }
  .back-link:hover{ color: var(--orange); }

  .toast{
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(0);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: var(--radius); font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(-4px); }

  /* Admin */
  .admin-form-row{ display:flex; gap: 10px; flex-wrap: wrap; align-items:flex-end; margin-bottom: 20px; }
  .admin-form-row > div{ flex: 1 1 140px; }
  .role-pill{
    font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: var(--radius);
    background: var(--steel); color:#fff;
  }
  .role-pill.eleve{ background: var(--steel-light); }

  /* ---- Messagerie ---- */
  .messagerie-board{ grid-template-columns: 260px 1fr; }
  .thread-list{ display:flex; flex-direction:column; gap:6px; }
  .thread-item{
    display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px;
    text-align:left; background:#fdfcfa; border:1px solid var(--line); border-radius: var(--radius);
    padding: 8px 10px; cursor:pointer; font-family: var(--sans);
  }
  .thread-item.active{ border-color: var(--orange); background:#fff9f4; }
  .thread-name{ font-weight:700; font-size: 13px; }
  .thread-preview{ flex-basis:100%; font-size:11.5px; color: var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .unread-dot{ width:8px; height:8px; border-radius:50%; background: var(--orange); display:inline-block; }

  .thread-scroll{
    max-height: 360px; overflow-y:auto; display:flex; flex-direction:column; gap:10px;
    padding: 4px 2px 14px; margin-bottom: 12px;
  }
  .msg-row{ display:flex; }
  .msg-row.eleve{ justify-content:flex-end; }
  .msg-row.enseignant, .msg-row.bot, .msg-row.client{ justify-content:flex-start; }
  .msg-bubble{
    max-width: 78%; padding: 8px 12px; border-radius: var(--radius);
    background: #f0eee7; border: 1px solid var(--line);
  }
  .msg-row.eleve .msg-bubble{ background: #fff2ea; border-color: #f0c9ac; }
  .msg-row.bot .msg-bubble{ background: #eef3f4; border-color: #cddadd; }
  .msg-row.client .msg-bubble{ background: #fdf6e3; border-color: #e8d18a; }

  .order-line{
    display:flex; gap:8px; align-items:center; margin-bottom:8px;
  }
  .order-line select{ flex:1 1 auto; }
  .order-line input{ width:70px; flex:0 0 70px; }
  .order-line-remove{
    background:none; border:1px solid var(--line); color: var(--ink-soft); cursor:pointer;
    padding: 8px 10px; border-radius: var(--radius); flex:0 0 auto;
  }
  .order-line-remove:hover{ color: var(--danger); border-color: var(--danger); }
  .msg-meta{ font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft); margin-bottom: 3px; text-transform: uppercase; letter-spacing:0.03em; display:flex; align-items:center; gap:6px; }
  .msg-del{
    margin-left:auto; background:none; border:none; color: var(--ink-soft); cursor:pointer;
    font-size: 12px; line-height:1; padding: 0 2px;
  }
  .msg-del:hover{ color: var(--danger); }
  .msg-body{ font-size: 13.5px; line-height:1.45; white-space: pre-wrap; }
  .msg-time{ font-family: var(--mono); font-size: 10px; color: var(--ink-soft); margin-top: 5px; text-align:right; }

  .compose-box textarea{
    width:100%; padding: 9px 10px; font-family: var(--sans); font-size: 14px;
    border: 1px solid var(--line); border-radius: var(--radius); background: #fdfcfa; color: var(--ink); resize: vertical;
  }
  .compose-box{ border-top: 1px solid var(--line); padding-top: 14px; }
  @media (max-width: 720px){ .messagerie-board{ grid-template-columns: 1fr; } }
</style>
</head>

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  /* ============ STORAGE (Firebase Realtime Database) ============ */
  const DB_ROOT = "suiteLogistiqueDarboux";

  function dbRef(path){
    return firebase.database().ref(`${DB_ROOT}/${path}`);
  }

  function dbRefGroupe(path){
    return firebase.database().ref(`${DB_ROOT}/groupes/${state.activeGroupe}/${path}`);
  }

  async function fbGetAll(ref){
    const snap = await ref.get();
    const val = snap.val();
    return val ? Object.values(val) : [];
  }

  async function fbSetAll(ref, items){
    const obj = {};
    items.forEach(item => { obj[item.id] = item; });
    await ref.set(obj);
  }

  async function loadUsers(){
    try{ state.users = await fbGetAll(dbRef("users")); }
    catch(e){ state.users = []; throw e; }
  }
  async function saveUsers(){
    try{ await fbSetAll(dbRef("users"), state.users); }
    catch(e){ showToast("Échec de l'enregistrement des comptes."); }
  }
  async function loadModuleTable(key){
    try{ state.moduleData[key] = await fbGetAll(dbRefGroupe(key)); }
    catch(e){ state.moduleData[key] = []; }
  }
  async function loadAllModuleTables(){
    for(const key of Object.keys(TABLES)) await loadModuleTable(key);
  }
  async function saveModuleTable(key){
    try{ await fbSetAll(dbRefGroupe(key), state.moduleData[key]); }
    catch(e){ showToast("Échec de l'enregistrement."); }
  }

  async function loadMessages(){
    try{ state.messages = await fbGetAll(dbRefGroupe("messages")); }
    catch(e){ state.messages = []; }
  }
  async function saveMessages(){
    try{ await fbSetAll(dbRefGroupe("messages"), state.messages); }
    catch(e){ showToast("Échec de l'envoi du message."); }
  }

  async function getUnreadFromEleveInGroupe(groupe){
    try{
      const msgs = await fbGetAll(dbRef(`groupes/${groupe}/messages`));
      return msgs.some(m => m.from === "eleve" && !m.readByTeacher);
    }catch(e){ return false; }
  }

  /* Session : simple mémoire du navigateur (hors bac à sable Claude, localStorage fonctionne normalement ici) */
  function loadSession(){
    try{ return localStorage.getItem("gd_logistique_session"); }catch(e){ return null; }
  }
  function saveSession(matricule){
    try{ localStorage.setItem("gd_logistique_session", matricule); }catch(e){}
  }
  function clearSession(){
    try{ localStorage.removeItem("gd_logistique_session"); }catch(e){}
  }

  /* ============ BOT MESSAGERIE (100% local, sans appel réseau) ============ */
  const CANNED_REPLIES = {
    technique: "Message reçu. Quelques pistes avant que votre enseignant ne regarde : rafraîchissez la page, vérifiez votre matricule/mot de passe, et si le souci persiste, décrivez précisément ce qui ne fonctionne pas (ce qui s'affiche, ce que vous avez cliqué). Votre enseignant a été notifié.",
    absence: "Message bien reçu. Votre enseignant en a été informé et pourra revenir vers vous si besoin.",
    rdv: "Votre demande de rendez-vous a été transmise à votre enseignant, qui vous recontactera pour convenir d'un horaire."
  };

  const FAQ_KEYWORDS = [
    { match: ["stock", "inventaire", "quantit"], reply: "Pour une question de gestion de stock : la table Stock du module « Base du magasin » relie un produit à un emplacement avec une quantité. Vérifiez que le produit et l'emplacement concernés existent déjà dans leurs tables respectives. Votre enseignant complétera si besoin." },
    { match: ["picking", "préparation de commande", "prepa commande"], reply: "Pour la préparation de commandes, pensez à l'ordre logique : vérifier le bon de commande, localiser l'emplacement via son code, prélever la quantité exacte, puis mettre à jour le stock. Votre enseignant reviendra vers vous pour les détails de l'exercice." },
    { match: ["emplacement", "allée", "zone", "entrepot", "entrepôt"], reply: "Pour les emplacements, le code suit en général une logique zone-allée-niveau (ex : A-03-02). Consultez la table Emplacements du module magasin pour voir les codes déjà créés. Votre enseignant vous précisera si besoin." },
    { match: ["transport", "tourn", "livraison", "camion"], reply: "Les questions de transport et de tournées seront couvertes plus en détail dans le module dédié (bientôt disponible). Votre enseignant peut déjà vous orienter en attendant." },
    { match: ["fournisseur", "délai", "delai"], reply: "Pour les fournisseurs, la table Fournisseurs du module magasin recense le nom, le contact et le délai de livraison. Si l'info n'y figure pas encore, c'est à ajouter avant de continuer l'exercice." },
    { match: ["caces", "chariot", "engin"], reply: "Les questions sur la conduite d'engins et le CACES relèvent d'un encadrement pratique : votre enseignant vous répondra directement sur ce point." }
  ];

  async function getBotReply(objetKey, body){
    const objet = OBJETS.find(o => o.key === objetKey);
    if(!objet || objet.mode === "canned"){
      return CANNED_REPLIES[objetKey] || "Message transmis à votre enseignant.";
    }
    const lower = (body || "").toLowerCase();
    const hit = FAQ_KEYWORDS.find(f => f.match.some(k => lower.includes(k)));
    if(hit) return hit.reply;
    return "Merci pour votre message. C'est une question précise qui mérite une réponse de votre enseignant, qui vous répondra directement ici. En attendant, vous pouvez consulter le module concerné ou vos notes de cours.";
  }

  /* ============ AUTH ============ */
  function findUser(matricule){
    return state.users.find(u => u.matricule.toUpperCase() === (matricule || "").toUpperCase());
  }

  async function handleLogin(matricule, password){
    const user = findUser(matricule);
    if(!user || user.password !== password){
      state.loginError = "Matricule ou mot de passe incorrect.";
      render();
      return;
    }
    state.currentUser = user;
    state.activeGroupe = user.role === "eleve" ? (user.groupe || null) : null;
    state.loginError = "";
    await saveSession(user.matricule);
    state.view = "menu";
    render();
  }

  async function handleLogout(){
    state.currentUser = null;
    state.activeGroupe = null;
    await clearSession();
    state.view = "login";
    render();
  }

  async function handleSetupTeacher(matricule, nom, password){
    if(!matricule || !nom || !password){
      state.setupError = "Tous les champs sont obligatoires.";
      render();
      return;
    }
    const teacher = { id: uid(), matricule: matricule.toUpperCase(), nom, password, role: "enseignant" };
    state.users.push(teacher);
    await saveUsers();
    state.currentUser = teacher;
    await saveSession(teacher.matricule);
    state.view = "menu";
    render();
  }

  /* ============ RENDER : ROOT ============ */
  function render(){
    if(state.view === "loading") app.innerHTML = `<div class="loading-row">Chargement…</div>`;
    else if(state.view === "storage-error") renderStorageError();
    else if(state.view === "setup") renderSetup();
    else if(state.view === "login") renderLogin();
    else {
      // authenticated views share a topbar
      app.innerHTML = `
        <header class="topbar">
          <div class="brand">
            <div class="brand-mark">GD</div>
            <div>
              <div class="brand-name">Lycée Gaston Darboux</div>
              <div class="brand-tagline">Bac Pro Logistique · Nîmes</div>
            </div>
          </div>
          <div class="session-chip">
            <span class="badge-role ${state.currentUser.role === 'eleve' ? 'eleve' : ''}">${state.currentUser.role === 'enseignant' ? 'ENSEIGNANT' : 'ÉLÈVE'}</span>
            <span>${state.currentUser.nom} (${state.currentUser.matricule})</span>
            ${state.activeGroupe ? `<span class="badge-role" style="background:var(--orange);">GROUPE ${state.activeGroupe}</span>` : ""}
            <button class="logout-link" id="logoutBtn">Se déconnecter</button>
          </div>
        </header>
        <div class="hazard"></div>
        <div id="content"></div>
      `;
      document.getElementById("logoutBtn").addEventListener("click", handleLogout);
      const content = document.getElementById("content");
      if(state.view === "menu") renderMenu(content);
      else if(state.view === "admin") renderAdmin(content);
      else if(state.view === "groupe-select") renderGroupeSelect(content);
      else if(state.view === "module") renderModule(content);
    }
  }

  /* ============ RENDER : STORAGE ERROR ============ */

    const isConfigIssue = state.storageErrorReason === "config";
    app.innerHTML = `
      <div class="center-stage">
        <div class="badge-card">
          <div class="institution-line">LYCÉE GASTON DARBOUX — NÎMES</div>
          <div class="badge-icon">CONNEXION À LA BASE</div>
          <h1>${isConfigIssue ? "Configuration manquante" : "Base inaccessible"}</h1>
          <p class="sub">${isConfigIssue
            ? "La configuration Firebase n'a pas encore été renseignée dans le fichier. C'est une étape de mise en place à faire une seule fois par l'enseignant."

          <div class="info-box">${isConfigIssue
            ? "Ouvrez le fichier, repérez le bloc « CONFIGURATION FIREBASE » en haut du script, et remplacez les valeurs REMPLACER_… par celles de votre projet Firebase."

  /* ============ RENDER : MENU ============ */
  async function computeUnreadForMenu(){
    if(state.currentUser.role === "enseignant"){
      for(const g of GROUPES){
        if(await getUnreadFromEleveInGroupe(g)) return true;
      }
      return false;
    }
    if(!state.currentUser.groupe) return false;
    state.activeGroupe = state.currentUser.groupe;
    await loadMessages();
    return state.messages.some(m => m.matricule === state.currentUser.matricule && m.from !== "eleve" && !m.readByStudent);
  }

  async function renderMenu(content){
    content.innerHTML = `<div class="loading-row">Chargement…</div>`;
    const unread = await computeUnreadForMenu();
    const noGroupe = state.currentUser.role === "eleve" && !state.currentUser.groupe;

    const tiles = MODULES.map(m => `
      <button class="module-tile ${m.ready && !noGroupe ? "" : "disabled"}" data-module="${m.id}" ${m.ready && !noGroupe ? "" : "disabled"}>
        ${m.id === "messagerie" && unread ? `<span class="tile-badge" title="Nouveau message"></span>` : ""}
        <span class="code">${m.code}</span>
        <div class="title">${m.title}</div>
        <div class="desc">${m.desc}</div>
      </button>
    `).join("");

    const adminTile = state.currentUser.role === "enseignant" ? `
      <button class="module-tile admin" id="adminTile">
        <span class="code">ADMIN</span>
        <div class="title">Gestion des comptes</div>
        <div class="desc">Ajouter, modifier ou retirer des comptes élèves.</div>
      </button>
    ` : "";

    content.innerHTML = `
      <div class="menu-intro">
        <h1>Bonjour ${state.currentUser.nom.split(" ")[0] || state.currentUser.nom}</h1>
        <p>Choisissez un module pour vous entraîner sur les problématiques logistiques de la classe.</p>
      </div>
      ${noGroupe ? `<div class="error-box" style="margin-bottom:18px;">Votre compte n'est pas encore rattaché à un groupe. Contactez votre enseignant.</div>` : ""}
      <div class="module-grid">${adminTile}${tiles}</div>
      <footer class="site-footer">Lycée professionnel Gaston Darboux — 7 rue Jules Raimu, Nîmes · Bac Pro Métiers de la Logistique</footer>
    `;

    if(state.currentUser.role === "enseignant"){
      document.getElementById("adminTile").addEventListener("click", () => { state.view = "admin"; render(); });
    }
    content.querySelectorAll(".module-tile[data-module]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const moduleId = btn.dataset.module;
        if(state.currentUser.role === "enseignant"){
          state.pendingModule = moduleId;
          state.view = "groupe-select";
          render();
          return;
        }
        if(!state.activeGroupe){
          showToast("Votre compte n'est pas encore rattaché à un groupe.");
          return;
        }
        await enterModule(moduleId);
      });
    });
  }

  async function enterModule(moduleId){
    state.activeModule = moduleId;
    if(moduleId === "magasin"){
      await loadAllModuleTables();
      state.activeTable = "produits";
      state.editingRowId = null;
    }
    if(moduleId === "messagerie"){
      await loadMessages();
      if(state.currentUser.role === "enseignant"){
        await loadModuleTable("produits");
        await loadModuleTable("clients");
      }
      state.activeThreadMatricule = state.currentUser.role === "eleve" ? state.currentUser.matricule : null;
    }
    state.view = "module";
    render();
  }

  /* ============ RENDER : MODULE MAGASIN ============ */
  function canDelete(row){
    return state.currentUser.role === "enseignant" || row.createdBy === state.currentUser.matricule;

  function fieldInputHTML(field, value){
    const v = value !== undefined && value !== null ? value : "";
    if(field.type === "select"){
      return `<select id="f_${field.key}"><option value="">— Choisir —</option>${field.options.map(o => `<option value="${o}" ${o === v ? "selected" : ""}>${o}</option>`).join("")}</select>`;
    }
    if(field.type === "linked-select"){
      const rows = state.moduleData[field.linkedTable];
      if(rows.length === 0) return `<select id="f_${field.key}" disabled><option>Aucun élément dans ${TABLES[field.linkedTable].label}</option></select>`;
      return `<select id="f_${field.key}"><option value="">— Choisir —</option>${rows.map(r => `<option value="${field.linkedValue(r)}" ${field.linkedValue(r) === v ? "selected" : ""}>${field.linkedDisplay(r)}</option>`).join("")}</select>`;
    }
    return `<input id="f_${field.key}" type="${field.type}" data-mono="${!!field.code}" placeholder="${field.placeholder || ""}" value="${(v+"").replace(/"/g,"&quot;")}" />`;
  }

  function displayValue(row, field){
    if(field.type === "linked-select"){
      const linked = state.moduleData[field.linkedTable].find(r => field.linkedValue(r) === row[field.key]);
      return linked ? field.linkedDisplay(linked) : `<em>${row[field.key]} (introuvable)</em>`;
    }
    return row[field.key] || "—";
  }

      for(const f of t.fields){

      }
      const keyField = t.fields.find(f => f.code);
      if(keyField){

        await saveModuleTable(state.activeTable);
        showToast("Entrée supprimée.");
        render();
      });
    });
  }

  function computeInitials(fullName){
    const words = fullName.trim().split(/\s+/).filter(Boolean);
    if(words.length === 0) return "?";
    let i = 0;
    while(i < words.length - 1 && words[i] === words[i].toUpperCase() && /[A-ZÀ-Ÿ]/.test(words[i])){
      i++;
    }
    if(i === 0) i = 1;
    const surname = words.slice(0, i).join(" ");
    const firstname = words.slice(i).join(" ") || words[words.length - 1];
    const firstNameWord = firstname.trim().split(/\s+/)[0] || "?";
    const properFirstName = firstNameWord.charAt(0).toUpperCase() + firstNameWord.slice(1).toLowerCase();
    const surnameInitial = (surname.trim()[0] || "?").toUpperCase();
    return `${properFirstName} ${surnameInitial}.`;
  }

  function parseCSV(text){
    const rows = [];
    let i = 0, field = "", row = [], inQuotes = false;
    const len = text.length;
    while(i < len){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if(c === '"'){ inQuotes = true; i++; continue; }
      if(c === ";"){ row.push(field); field = ""; i++; continue; }
      if(c === "\r"){ i++; continue; }
      if(c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
      field += c; i++;
    }
    if(field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
    return rows;
  }

  async function handleCsvImport(file, t){
    const rawText = await file.text();
    const text = rawText.replace(/^\uFEFF/, "");
    const rows = parseCSV(text).filter(r => r.some(c => c.trim() !== ""));
    if(rows.length < 2){
      showToast("Fichier CSV vide ou illisible.");
      return;
    }
    const headerRow = rows[0].map(h => h.trim().toLowerCase());
    const fieldIndexes = t.fields.map(f => headerRow.indexOf(f.label.toLowerCase()));
    if(fieldIndexes.some(idx => idx === -1)){
      showToast(`Colonnes attendues pour ${t.label} : ${t.fields.map(f => f.label).join(", ")}.`);
      return;
    }
    const keyField = t.fields.find(f => f.code);
    let added = 0, skipped = 0;
    for(let r = 1; r < rows.length; r++){
      const cells = rows[r];
      const entry = { id: uid(), createdBy: state.currentUser.matricule, createdByNom: state.currentUser.nom };
      let invalid = false;
      t.fields.forEach((f, idx) => {
        let val = (cells[fieldIndexes[idx]] || "").trim();
        if(f.code) val = val.toUpperCase();
        if(f.required && !val) invalid = true;
        entry[f.key] = val;
      });
      if(invalid){ skipped++; continue; }
      if(keyField && state.moduleData[state.activeTable].some(row => row[keyField.key] === entry[keyField.key])){
        skipped++; continue;
      }
      state.moduleData[state.activeTable].push(entry);
      added++;
    }
    if(added > 0) await saveModuleTable(state.activeTable);
    showToast(`${added} ligne(s) importée(s)${skipped ? `, ${skipped} ignorée(s)` : ""}.`);
    render();
  }

  async function handleRosterCsvImport(file, groupe){
    const rawText = await file.text();
    const text = rawText.replace(/^\uFEFF/, "");
    const rows = parseCSV(text).filter(r => r.some(c => c.trim() !== ""));
    if(rows.length < 2){
      showToast("Fichier CSV vide ou illisible.");
      return;
    }
    const header = rows[0].map(h => h.trim().toLowerCase());
    const idxEleve = header.findIndex(h => h.includes("élève") || h.includes("eleve"));
    const idxMatricule = header.findIndex(h => h.includes("matricule"));
    const idxMotDePasse = header.findIndex(h => h.includes("mot de passe") || h.includes("password"));
    if(idxMatricule === -1){
      showToast("Colonne « Matricule » introuvable dans le fichier.");
      return;
    }
    let added = 0, skipped = 0;
    for(let r = 1; r < rows.length; r++){
      const cells = rows[r];
      const matricule = (cells[idxMatricule] || "").trim().toUpperCase();
      if(!matricule || findUser(matricule)){ if(matricule) skipped++; continue; }
      const fullName = idxEleve !== -1 ? (cells[idxEleve] || "").trim() : "";
      const nom = fullName ? computeInitials(fullName) : matricule;
      const password = (idxMotDePasse !== -1 && (cells[idxMotDePasse] || "").trim()) ? cells[idxMotDePasse].trim() : matricule;
      state.users.push({ id: uid(), matricule, nom, password, role: "eleve", groupe });
      added++;
    }
    if(added > 0) await saveUsers();
    showToast(`${added} élève(s) importé(s) dans ${groupe}${skipped ? `, ${skipped} déjà existant(s) ignoré(s)` : ""}.`);
    render();
  }

    document.getElementById("backBtn").addEventListener("click", () => { state.view = "menu"; render(); });
    document.getElementById("changeGroupeBtn").addEventListener("click", () => {
      state.pendingModule = "messagerie";
      state.view = "groupe-select";
      render();
    });

    if(state.moduleData.clients.length > 0 && state.moduleData.produits.length > 0){
      const linesHost = document.getElementById("orderLines");
      let lineCount = 0;

      function addOrderLine(){
        lineCount++;
        const row = document.createElement("div");
        row.className = "order-line";
        row.dataset.lineId = lineCount;
        row.innerHTML = `
          <select class="order-line-produit">${state.moduleData.produits.map(p => `<option value="${p.reference}">${p.reference} — ${p.designation}</option>`).join("")}</select>
          <input class="order-line-qte" type="number" min="1" value="1" placeholder="Qté" />
          <button type="button" class="order-line-remove" title="Retirer cette ligne">✕</button>
        `;
        row.querySelector(".order-line-remove").addEventListener("click", () => {
          if(linesHost.children.length > 1){ row.remove(); }
          else { showToast("Il faut au moins une ligne de produit."); }
        });
        linesHost.appendChild(row);
      }
      addOrderLine();

      document.getElementById("addOrderLineBtn").addEventListener("click", addOrderLine);

      document.getElementById("generateOrderBtn").addEventListener("click", async () => {
        const errorBox = document.getElementById("orderError");
        errorBox.innerHTML = "";
        const client = state.moduleData.clients.find(c => c.id === document.getElementById("orderClient").value);
        const lineRows = [...linesHost.querySelectorAll(".order-line")];
        const lines = lineRows.map(row => {
          const ref = row.querySelector(".order-line-produit").value;
          const qte = parseInt(row.querySelector(".order-line-qte").value, 10);
          const produit = state.moduleData.produits.find(p => p.reference === ref);
          return { ref, qte, designation: produit ? produit.designation : ref };
        });
        if(lines.some(l => !l.qte || l.qte < 1)){
          errorBox.innerHTML = `<div class="error-box">Chaque ligne doit avoir une quantité d'au moins 1.</div>`;
          return;
        }
        const recipientValue = document.getElementById("orderRecipient").value;
        const recipients = recipientValue === "__all__" ? students.map(s => s.matricule) : [recipientValue];

        const linesText = lines.map(l => `- ${l.ref} x ${l.qte} — ${l.designation}`).join("\n");
        const body = `Bonjour,\n\nMerci de bien vouloir préparer la commande suivante :\n\n${linesText}\n\n${client.adresse ? `Adresse de livraison : ${client.adresse}\n` : ""}Merci de nous confirmer la prise en charge.\n\nCordialement,\n${client.nom}${client.contact ? `\n${client.contact}` : ""}`;

        const ts = Date.now();
        recipients.forEach(matricule => {
          state.messages.push({
            id: uid(), matricule, from: "client", authorNom: client.nom,
            objetLabel: "Commande client", body, timestamp: ts,
            readByStudent: false, readByTeacher: true
          });
        });
        await saveMessages();
        showToast(`Commande envoyée à ${recipients.length} élève(s).`);
        renderMessagerieEnseignant(content);
      });
    }

    document.getElementById("broadcastBtn").addEventListener("click", async () => {
      const body = document.getElementById("broadcastBody").value.trim();
      const errorBox = document.getElementById("broadcastError");
      errorBox.innerHTML = "";
      if(!body){
        errorBox.innerHTML = `<div class="error-box">Écrivez un message avant d'envoyer.</div>`;
        return;
      }
      const btn = document.getElementById("broadcastBtn");
      btn.disabled = true;
      btn.textContent = "Envoi…";
      const ts = Date.now();
      students.forEach(s => {
        state.messages.push({
          id: uid(), matricule: s.matricule, from: "enseignant", authorNom: state.currentUser.nom,
          objetLabel: "Message de l'enseignant (à toute la classe)", body, timestamp: ts,
          readByStudent: false, readByTeacher: true
        });
      });
      await saveMessages();
      showToast(`Message envoyé à ${students.length} élève(s).`);
      renderMessagerieEnseignant(content);
    });

    content.querySelectorAll(".thread-item").forEach(btn => {
      btn.addEventListener("click", async () => {
        state.activeThreadMatricule = btn.dataset.matricule;
        await markThreadRead(state.activeThreadMatricule, "enseignant");
        renderMessagerieEnseignant(content);
      });
    });

    if(activeStudent){
      const scrollBox = document.getElementById("threadScroll");
      if(scrollBox) scrollBox.scrollTop = scrollBox.scrollHeight;
      markThreadRead(activeStudent.matricule, "enseignant");
      wireBubbleDeletes(content, renderMessagerieEnseignant);

      document.getElementById("sendBtn").addEventListener("click", async () => {
        const body = document.getElementById("msgBody").value.trim();
        const errorBox = document.getElementById("msgError");
        errorBox.innerHTML = "";
        if(!body){
          errorBox.innerHTML = `<div class="error-box">Écrivez un message avant d'envoyer.</div>`;
          return;
        }
        state.messages.push({
          id: uid(), matricule: activeStudent.matricule, from: "enseignant", authorNom: state.currentUser.nom,
          objetLabel: "Message de l'enseignant", body, timestamp: Date.now(),
          readByStudent: false, readByTeacher: true
        });
        await saveMessages();
        showToast("Message envoyé.");
        renderMessagerieEnseignant(content);
      });
    }
  }

  async function initFirebaseConnection(){
    try{
      if(!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("REMPLACER")){
        return { ok:false, reason:"config" };
      }
      firebase.initializeApp(firebaseConfig);
      await firebase.auth().signInAnonymously();
      await dbRef("users").get();
      return { ok:true };
    }catch(e){
      return { ok:false, reason:"connection", detail: e.message };
    }
  }

  /* ============ INIT ============ */
  async function init(){
    const connection = await initFirebaseConnection();
    if(!connection.ok){
      state.view = "storage-error";
      state.storageErrorReason = connection.reason;
      render();
      return;
    }
    await loadUsers();
    if(state.users.length === 0){
      state.view = "setup";
      render();
      return;
    }
    const sessionMatricule = loadSession();
    if(sessionMatricule){
      const user = findUser(sessionMatricule);
      if(user){
        state.currentUser = user;
        state.activeGroupe = user.role === "eleve" ? (user.groupe || null) : null;
        state.view = "menu";
        render();
        return;
      }
    }
    state.view = "login";
    render();
  }
  init();

})();
</script>

</body>
