  /* ============ RENDER : MODULE MESSAGERIE ============ */
  function threadFor(matricule){
    return state.messages
      .filter(m => m.matricule === matricule)
      .sort((a,b) => a.timestamp - b.timestamp);
  }

  function canDeleteMessage(m){
    if(state.currentUser.role === "enseignant") return true;
    return m.from === "eleve" && m.matricule === state.currentUser.matricule;
  }

  function senderLabelFor(m){
    if(m.from === "enseignant") return "Enseignant";
    if(m.from === "bot") return "Assistant";
    if(m.from === "client") return `${m.authorNom} (Client)`;
    return m.authorNom;
  }

  function isUnreadFor(m, viewerRole){
    if(viewerRole === "eleve") return m.from !== "eleve" && !m.readByStudent;
    return m.from === "eleve" && !m.readByTeacher;
  }

  function emailRowHTML(m, viewerRole){
    const unread = isUnreadFor(m, viewerRole);
    const sender = viewerRole === "eleve" && m.from === "eleve" ? "Moi" : senderLabelFor(m);
    const dateLabel = new Date(m.timestamp).toLocaleString("fr-FR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
    const snippet = (m.body || "").replace(/\s+/g, " ").trim().slice(0, 90);
    return `
      <button class="mail-row ${unread ? "unread" : ""}" data-id="${m.id}">
        <span class="mail-dot">${unread ? "●" : ""}</span>
        <span class="mail-sender">${sender}</span>
        <span class="mail-subject-line"><span class="mail-subject">${m.objetLabel || "(Sans objet)"}</span><span class="mail-snippet">${snippet}</span></span>
        <span class="mail-date">${dateLabel}</span>
      </button>
    `;
  }

  function emailDetailHTML(m, viewerRole){
    const sender = viewerRole === "eleve" && m.from === "eleve" ? `${m.authorNom} (vous)` : senderLabelFor(m);
    const badgeClass = m.from === "client" ? "client" : (m.from === "bot" ? "bot" : "");
    const dateLabel = new Date(m.timestamp).toLocaleString("fr-FR", { day:"2-digit", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit" });
    return `
      <div class="mail-detail">
        <div class="mail-detail-header">
          <div class="mail-detail-subject">${m.objetLabel || "(Sans objet)"}</div>
          <div class="mail-detail-meta">De : <strong>${sender}</strong>${badgeClass ? `<span class="mail-detail-badge ${badgeClass}">${m.from}</span>` : ""} · ${dateLabel}</div>
        </div>
        <div class="mail-detail-body">${(m.body || "").replace(/</g,"&lt;")}</div>
      </div>
    `;
  }

  // Marque UN SEUL message comme lu (pas tout le fil), comme dans une vraie messagerie.
  async function markMessageRead(id, viewerRole){
    const field = viewerRole === "eleve" ? "readByStudent" : "readByTeacher";
    const m = state.messages.find(x => x.id === id);
    if(!m || m[field]) return;
    m[field] = true;
    await fbUpdatePaths(dbRefGroupe("messages"), { [`${id}/${field}`]: true });
  }

  function renderMessagerie(content){
    if(state.currentUser.role === "eleve"){
      renderMessagerieEleve(content);
    } else {
      renderMessagerieEnseignant(content);
    }
  }

  async function renderMessagerieEleve(content){
    const matricule = state.currentUser.matricule;
    const thread = threadFor(matricule).slice().reverse(); // plus récent en premier, comme une boîte de réception

    content.innerHTML = `
      <button class="back-link" id="backBtn">&larr; Retour au menu</button>
      <div class="panel mail-panel">
        <div class="mail-toolbar">
          <h2>Messagerie — ${state.currentUser.nom}</h2>
          <button class="btn btn-primary" id="newMsgBtn" style="width:auto;">Nouveau message</button>
        </div>
        <div id="mailBody"></div>
      </div>
    `;
    document.getElementById("backBtn").addEventListener("click", () => { state.view = "menu"; render(); });
    document.getElementById("newMsgBtn").addEventListener("click", () => {
      state.mailView = "compose";
      state.openMessageId = null;
      renderMessagerieEleve(content);
    });

    const mailBody = document.getElementById("mailBody");

    if(state.mailView === "compose" || state.mailView === "reply"){
      drawCompose();
    } else if(state.mailView === "detail" && state.openMessageId){
      drawDetail();
    } else {
      drawList();
    }

    function drawList(){
      mailBody.innerHTML = thread.length === 0
        ? `<div class="mail-empty"><strong>Boîte de réception vide</strong>Envoyez votre premier message avec « Nouveau message ».</div>`
        : `<div class="mail-list">${thread.map(m => emailRowHTML(m, "eleve")).join("")}</div>`;
      mailBody.querySelectorAll(".mail-row").forEach(row => {
        row.addEventListener("click", async () => {
          state.openMessageId = row.dataset.id;
          state.mailView = "detail";
          await markMessageRead(state.openMessageId, "eleve");
          renderMessagerieEleve(content);
        });
      });
    }

    function drawDetail(){
      const m = thread.find(x => x.id === state.openMessageId);
      if(!m){ state.mailView = "list"; renderMessagerieEleve(content); return; }
      mailBody.innerHTML = `
        <div class="mail-back"><button class="back-link" id="backToList">&larr; Retour à la boîte de réception</button></div>
        ${emailDetailHTML(m, "eleve")}
        <div class="mail-detail-actions">
          ${m.from !== "eleve" ? `<button class="btn btn-primary" id="replyBtn" style="width:auto;">Répondre</button>` : ""}
          ${canDeleteMessage(m) ? `<button class="btn-danger" id="deleteMailBtn">Supprimer</button>` : ""}
        </div>
      `;
      document.getElementById("backToList").addEventListener("click", () => {
        state.mailView = "list"; state.openMessageId = null; renderMessagerieEleve(content);
      });
      const replyBtn = document.getElementById("replyBtn");
      if(replyBtn) replyBtn.addEventListener("click", () => { state.mailView = "reply"; renderMessagerieEleve(content); });
      const deleteMailBtn = document.getElementById("deleteMailBtn");
      if(deleteMailBtn) deleteMailBtn.addEventListener("click", async () => {
        if(!confirm("Supprimer ce message ?")) return;
        const ok = await fbRemoveItem(dbRefGroupe("messages"), m.id);
        if(!ok) return;
        state.messages = state.messages.filter(x => x.id !== m.id);
        state.mailView = "list"; state.openMessageId = null;
        showToast("Message supprimé.");
        renderMessagerieEleve(content);
      });
    }

    function drawCompose(){
      const isReply = state.mailView === "reply";
      const original = isReply ? thread.find(x => x.id === state.openMessageId) : null;
      mailBody.innerHTML = `
        <div class="mail-back"><button class="back-link" id="cancelCompose">&larr; ${isReply ? "Annuler la réponse" : "Annuler"}</button></div>
        <div class="compose-box">
          ${isReply ? `<div class="mail-detail-meta" style="margin-bottom:12px;">En réponse à : <strong>${original.objetLabel || "(Sans objet)"}</strong> (${senderLabelFor(original)})</div>` : `
            <label for="msgObjet">Objet</label>
            <select id="msgObjet">${OBJETS.map(o => `<option value="${o.key}">${o.label}</option>`).join("")}</select>
          `}
          <label for="msgBody">Message</label>
          <textarea id="msgBody" rows="6" placeholder="Écrivez votre message…"></textarea>
          <div id="msgError"></div>
          <button class="btn btn-primary" id="sendBtn" style="width:auto; margin-top:14px;">Envoyer</button>
          ${!isReply ? `<div class="info-box" style="margin-top:16px;">Selon l'objet choisi, un premier retour peut être automatique (assistant). Votre enseignant voit tous vos messages et peut vous répondre directement.</div>` : ""}
        </div>
      `;
      document.getElementById("cancelCompose").addEventListener("click", () => {
        state.mailView = isReply ? "detail" : "list";
        renderMessagerieEleve(content);
      });

      document.getElementById("sendBtn").addEventListener("click", async () => {
        const body = document.getElementById("msgBody").value.trim();
        const errorBox = document.getElementById("msgError");
        errorBox.innerHTML = "";
        if(!body){
          errorBox.innerHTML = `<div class="error-box">Écrivez un message avant d'envoyer.</div>`;
          return;
        }
        const objetKey = isReply ? (original.objetKey || "autre") : document.getElementById("msgObjet").value;
        const objetLabel = isReply
          ? (original.objetLabel && original.objetLabel.startsWith("Ré : ") ? original.objetLabel : `Ré : ${original.objetLabel || "(Sans objet)"}`)
          : OBJETS.find(o => o.key === objetKey).label;
        const sendBtn = document.getElementById("sendBtn");
        sendBtn.disabled = true;
        sendBtn.textContent = "Envoi…";

        const eleveMsg = {
          id: uid(), matricule, from: "eleve", authorNom: state.currentUser.nom,
          objetKey, objetLabel, body, timestamp: Date.now(),
          readByStudent: true, readByTeacher: false
        };
        state.messages.push(eleveMsg);
        await fbPutItem(dbRefGroupe("messages"), eleveMsg);

        // La réponse automatique du bot n'intervient que pour un nouveau message, pas pour une réponse
        // à l'enseignant ou à un client (on ne veut pas d'un bot qui répond à la place de l'humain).
        if(!isReply){
          const botReply = await getBotReply(objetKey, body);
          const botMsg = {
            id: uid(), matricule, from: "bot", authorNom: "Assistant",
            objetLabel: "Réponse automatique", body: botReply, timestamp: Date.now(),
            readByStudent: true, readByTeacher: true
          };
          state.messages.push(botMsg);
          await fbPutItem(dbRefGroupe("messages"), botMsg);
        }

        showToast("Message envoyé.");
        state.mailView = "list";
        state.openMessageId = null;
        renderMessagerieEleve(content);
      });
    }
  }

  function renderMessagerieEnseignant(content){
    const students = state.users.filter(u => u.role === "eleve" && u.groupe === state.activeGroupe);
    const listHTML = students.map(s => {
      const thread = threadFor(s.matricule);
      const last = thread[thread.length - 1];
      const unread = thread.some(m => m.from === "eleve" && !m.readByTeacher);
      return `
        <button class="thread-item ${state.activeThreadMatricule === s.matricule ? "active" : ""}" data-matricule="${s.matricule}">
          <span class="thread-name">${s.nom} <span class="hint">(${s.matricule})</span></span>
          ${unread ? `<span class="unread-dot"></span>` : ""}
          <span class="thread-preview">${last ? (last.body || "").slice(0,42) : "Aucun message"}</span>
        </button>
      `;
    }).join("");

    const activeStudent = students.find(s => s.matricule === state.activeThreadMatricule);
    const thread = activeStudent ? threadFor(activeStudent.matricule).slice().reverse() : [];

    content.innerHTML = `
      <button class="back-link" id="backBtn">&larr; Retour au menu</button>
      <button class="back-link" id="changeGroupeBtn" style="margin-left:16px;">Changer de groupe (${state.activeGroupe})</button>
      <div class="panel" style="margin-bottom:16px;">
        <h2>Générer une commande client</h2>
        ${state.moduleData.clients.length === 0 ? `
          <div class="empty-state">Ajoutez au moins un client dans le module Base du magasin (table Clients) avant de générer une commande.</div>
        ` : state.moduleData.produits.length === 0 ? `
          <div class="empty-state">Ajoutez au moins un produit dans le module Base du magasin avant de générer une commande.</div>
        ` : `
          <label for="orderClient">Client (expéditeur)</label>
          <select id="orderClient">${state.moduleData.clients.map(c => `<option value="${c.id}">${c.nom}</option>`).join("")}</select>

          <label style="margin-top:14px;">Produits commandés</label>
          <div id="orderLines"></div>
          <button class="btn-ghost" id="addOrderLineBtn" style="margin-top:8px;">+ Ajouter un produit</button>

          <label style="margin-top:14px;">Destinataire(s)</label>
          <div class="recipient-box" id="recipientBox">
            <label class="recipient-item recipient-all">
              <input type="checkbox" id="recipientAll" /> <strong>Toute la classe</strong> (${students.length} élève${students.length > 1 ? "s" : ""})
            </label>
            <div class="recipient-divider"></div>
            ${students.map(s => `
              <label class="recipient-item">
                <input type="checkbox" class="recipient-student" value="${s.matricule}" /> ${s.nom} <span class="hint">(${s.matricule})</span>
              </label>
            `).join("")}
          </div>

          <div id="orderError"></div>
          <button class="btn btn-primary" id="generateOrderBtn" style="width:auto;">Générer et envoyer la commande</button>
        `}
      </div>
      <div class="panel" style="margin-bottom:16px;">
        <h2>Message à toute la classe</h2>
        <div class="compose-box" style="padding:0;">
          <label for="broadcastBody">Message envoyé à chaque élève</label>
          <textarea id="broadcastBody" rows="2" placeholder="ex : N'oubliez pas d'apporter votre carnet de stage demain."></textarea>
          <div id="broadcastError"></div>
          <button class="btn btn-primary" id="broadcastBtn" style="width:auto; margin-top:10px;">Envoyer à tous les élèves (${students.length})</button>
        </div>
      </div>
      <main class="board messagerie-board">
        <section class="panel">
          <h2>Élèves</h2>
          <div class="thread-list">${listHTML || `<div class="empty-state">Aucun élève enregistré.</div>`}</div>
        </section>
        <section class="panel mail-panel">
          ${activeStudent ? `
            <div class="mail-toolbar">
              <h2>${activeStudent.nom} — ${activeStudent.matricule}</h2>
              <button class="btn btn-primary" id="newMsgBtn" style="width:auto;">Nouveau message</button>
            </div>
            <div id="mailBody"></div>
          ` : `<div class="mail-empty"><strong>Sélectionnez un élève</strong>Choisissez un élève dans la liste pour voir sa messagerie.</div>`}
        </section>
      </main>
    `;

    document.getElementById("backBtn").addEventListener("click", () => { state.view = "menu"; render(); });
    document.getElementById("changeGroupeBtn").addEventListener("click", () => {
      state.pendingModule = "messagerie";
      state.view = "groupe-select";
      render();
    });

    if(state.moduleData.clients.length > 0 && state.moduleData.produits.length > 0){
      const linesHost = document.getElementById("orderLines");
      let lineCount = 0;

      function addOrderLine(){
        lineCount++;
        const row = document.createElement("div");
        row.className = "order-line";
        row.dataset.lineId = lineCount;
        row.innerHTML = `
          <select class="order-line-produit">${state.moduleData.produits.map(p => `<option value="${p.reference}">${p.reference} — ${p.designation}</option>`).join("")}</select>
          <input class="order-line-qte" type="number" min="1" value="1" placeholder="Qté" />
          <button type="button" class="order-line-remove" title="Retirer cette ligne">✕</button>
        `;
        row.querySelector(".order-line-remove").addEventListener("click", () => {
          if(linesHost.children.length > 1){ row.remove(); }
          else { showToast("Il faut au moins une ligne de produit."); }
        });
        linesHost.appendChild(row);
      }
      addOrderLine();

      document.getElementById("addOrderLineBtn").addEventListener("click", addOrderLine);

      const recipientAll = document.getElementById("recipientAll");
      const studentCheckboxes = [...document.querySelectorAll(".recipient-student")];
      recipientAll.addEventListener("change", () => {
        studentCheckboxes.forEach(cb => { cb.checked = false; cb.disabled = recipientAll.checked; });
      });

      document.getElementById("generateOrderBtn").addEventListener("click", async () => {
        const errorBox = document.getElementById("orderError");
        errorBox.innerHTML = "";
        const client = state.moduleData.clients.find(c => c.id === document.getElementById("orderClient").value);
        const lineRows = [...linesHost.querySelectorAll(".order-line")];
        const lines = lineRows.map(row => {
          const ref = row.querySelector(".order-line-produit").value;
          const qte = parseInt(row.querySelector(".order-line-qte").value, 10);
          const produit = state.moduleData.produits.find(p => p.reference === ref);
          return { ref, qte, designation: produit ? produit.designation : ref };
        });
        if(lines.some(l => !l.qte || l.qte < 1)){
          errorBox.innerHTML = `<div class="error-box">Chaque ligne doit avoir une quantité d'au moins 1.</div>`;
          return;
        }
        const recipients = recipientAll.checked
          ? students.map(s => s.matricule)
          : studentCheckboxes.filter(cb => cb.checked).map(cb => cb.value);
        if(recipients.length === 0){
          errorBox.innerHTML = `<div class="error-box">Sélectionnez au moins un destinataire.</div>`;
          return;
        }

        const linesText = lines.map(l => `- ${l.ref} x ${l.qte} — ${l.designation}`).join("\n");
        const body = `Bonjour,\n\nMerci de bien vouloir préparer la commande suivante :\n\n${linesText}\n\n${client.adresse ? `Adresse de livraison : ${client.adresse}\n` : ""}Merci de nous confirmer la prise en charge.\n\nCordialement,\n${client.nom}${client.contact ? `\n${client.contact}` : ""}`;

        const ts = Date.now();
        const newMsgs = recipients.map(matricule => ({
          id: uid(), matricule, from: "client", authorNom: client.nom,
          objetLabel: "Commande client", body, timestamp: ts,
          readByStudent: false, readByTeacher: true
        }));
        newMsgs.forEach(m => state.messages.push(m));
        await fbMergeItems(dbRefGroupe("messages"), newMsgs);
        showToast(`Commande envoyée à ${recipients.length} élève(s).`);
        renderMessagerieEnseignant(content);
      });
    }

    document.getElementById("broadcastBtn").addEventListener("click", async () => {
      const body = document.getElementById("broadcastBody").value.trim();
      const errorBox = document.getElementById("broadcastError");
      errorBox.innerHTML = "";
      if(!body){
        errorBox.innerHTML = `<div class="error-box">Écrivez un message avant d'envoyer.</div>`;
        return;
      }
      const btn = document.getElementById("broadcastBtn");
      btn.disabled = true;
      btn.textContent = "Envoi…";
      const ts = Date.now();
      const newMsgs = students.map(s => ({
        id: uid(), matricule: s.matricule, from: "enseignant", authorNom: state.currentUser.nom,
        objetLabel: "Message de l'enseignant (à toute la classe)", body, timestamp: ts,
        readByStudent: false, readByTeacher: true
      }));
      newMsgs.forEach(m => state.messages.push(m));
      await fbMergeItems(dbRefGroupe("messages"), newMsgs);
      showToast(`Message envoyé à ${students.length} élève(s).`);
      renderMessagerieEnseignant(content);
    });

    content.querySelectorAll(".thread-item").forEach(btn => {
      btn.addEventListener("click", () => {
        state.activeThreadMatricule = btn.dataset.matricule;
        state.mailView = "list";
        state.openMessageId = null;
        renderMessagerieEnseignant(content);
      });
    });

    if(!activeStudent) return;

    document.getElementById("newMsgBtn").addEventListener("click", () => {
      state.mailView = "compose";
      state.openMessageId = null;
      renderMessagerieEnseignant(content);
    });

    const mailBody = document.getElementById("mailBody");

    if(state.mailView === "compose" || state.mailView === "reply"){
      drawComposeTeacher();
    } else if(state.mailView === "detail" && state.openMessageId){
      drawDetailTeacher();
    } else {
      drawListTeacher();
    }

    function drawListTeacher(){
      mailBody.innerHTML = thread.length === 0
        ? `<div class="mail-empty"><strong>Aucun message</strong>Envoyez un message avec « Nouveau message ».</div>`
        : `<div class="mail-list">${thread.map(m => emailRowHTML(m, "enseignant")).join("")}</div>`;
      mailBody.querySelectorAll(".mail-row").forEach(row => {
        row.addEventListener("click", async () => {
          state.openMessageId = row.dataset.id;
          state.mailView = "detail";
          await markMessageRead(state.openMessageId, "enseignant");
          renderMessagerieEnseignant(content);
        });
      });
    }

    function drawDetailTeacher(){
      const m = thread.find(x => x.id === state.openMessageId);
      if(!m){ state.mailView = "list"; renderMessagerieEnseignant(content); return; }
      mailBody.innerHTML = `
        <div class="mail-back"><button class="back-link" id="backToList">&larr; Retour à la liste</button></div>
        ${emailDetailHTML(m, "enseignant")}
        <div class="mail-detail-actions">
          <button class="btn btn-primary" id="replyBtn" style="width:auto;">Répondre</button>
          ${canDeleteMessage(m) ? `<button class="btn-danger" id="deleteMailBtn">Supprimer</button>` : ""}
        </div>
      `;
      document.getElementById("backToList").addEventListener("click", () => {
        state.mailView = "list"; state.openMessageId = null; renderMessagerieEnseignant(content);
      });
      document.getElementById("replyBtn").addEventListener("click", () => {
        state.mailView = "reply"; renderMessagerieEnseignant(content);
      });
      const deleteMailBtn = document.getElementById("deleteMailBtn");
      if(deleteMailBtn) deleteMailBtn.addEventListener("click", async () => {
        if(!confirm("Supprimer ce message ?")) return;
        const ok = await fbRemoveItem(dbRefGroupe("messages"), m.id);
        if(!ok) return;
        state.messages = state.messages.filter(x => x.id !== m.id);
        state.mailView = "list"; state.openMessageId = null;
        showToast("Message supprimé.");
        renderMessagerieEnseignant(content);
      });
    }

    function drawComposeTeacher(){
      const isReply = state.mailView === "reply";
      const original = isReply ? thread.find(x => x.id === state.openMessageId) : null;
      mailBody.innerHTML = `
        <div class="mail-back"><button class="back-link" id="cancelCompose">&larr; ${isReply ? "Annuler la réponse" : "Annuler"}</button></div>
        <div class="compose-box">
          ${isReply ? `<div class="mail-detail-meta" style="margin-bottom:12px;">En réponse à : <strong>${original.objetLabel || "(Sans objet)"}</strong></div>` : ""}
          <label for="msgBody">Message</label>
          <textarea id="msgBody" rows="6" placeholder="Écrivez votre message…"></textarea>
          <div id="msgError"></div>
          <button class="btn btn-primary" id="sendBtn" style="width:auto; margin-top:14px;">Envoyer</button>
        </div>
      `;
      document.getElementById("cancelCompose").addEventListener("click", () => {
        state.mailView = isReply ? "detail" : "list";
        renderMessagerieEnseignant(content);
      });
      document.getElementById("sendBtn").addEventListener("click", async () => {
        const body = document.getElementById("msgBody").value.trim();
        const errorBox = document.getElementById("msgError");
        errorBox.innerHTML = "";
        if(!body){
          errorBox.innerHTML = `<div class="error-box">Écrivez un message avant d'envoyer.</div>`;
          return;
        }
        const objetLabel = isReply
          ? (original.objetLabel && original.objetLabel.startsWith("Ré : ") ? original.objetLabel : `Ré : ${original.objetLabel || "(Sans objet)"}`)
          : "Message de l'enseignant";
        const msg = {
          id: uid(), matricule: activeStudent.matricule, from: "enseignant", authorNom: state.currentUser.nom,
          objetLabel, body, timestamp: Date.now(),
          readByStudent: false, readByTeacher: true
        };
        state.messages.push(msg);
        await fbPutItem(dbRefGroupe("messages"), msg);
        showToast("Message envoyé.");
        state.mailView = "list";
        state.openMessageId = null;
        renderMessagerieEnseignant(content);
      });
    }
  }

  async function initFirebaseConnection(){
    try{
      if(!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("REMPLACER")){
        return { ok:false, reason:"config" };
      }
      firebase.initializeApp(firebaseConfig);
      await firebase.auth().signInAnonymously();
      await dbRef("users").get();
      return { ok:true };
    }catch(e){
      return { ok:false, reason:"connection", detail: e.message };
    }
  }

  /* ============ INIT ============ */
  async function init(){
    const connection = await initFirebaseConnection();
    if(!connection.ok){
      state.view = "storage-error";
      state.storageErrorReason = connection.reason;
      render();
      return;
    }
    await loadUsers();
    if(state.users.length === 0){
      state.view = "setup";
      render();
      return;
    }
    const sessionMatricule = loadSession();
    if(sessionMatricule){
      const user = findUser(sessionMatricule);
      if(user){
        state.currentUser = user;
        state.activeGroupe = user.role === "eleve" ? (user.groupe || null) : null;
        state.view = "menu";
        render();
        return;
      }
    }
    state.view = "login";
    render();
  }
  init();

})();
</script>

</body>
</html>
